=document.getElementById('sTxt');\n  const d2=document.getElementById('hDot'),t2=document.getElementById('hTxt');\n  if(on){d1.className='dot on';t1.textContent='Configurada';d2.className='dot on';t2.textContent='API ativa'}\n  else{d1.className='dot err';t1.textContent='Não configurada';d2.className='dot err';t2.textContent='API inativa'}\n}\n\n// ═══════════════════════════════════════════════\n//  EVENT LISTENERS – SAVES\n// ═══════════════════════════════════════════════\ndocument.getElementById('saveKeyBtn').onclick=()=>{\n  const k=document.getElementById('apiKey').value.trim();\n  if(!k){toast('Insira uma API Key válida.','warning');return}\n  S.set('apiKey',k);S.set('gemini_api_key',k);setApiStatus(true);toast('API Key salva!','success');\n};\ndocument.getElementById('savePdfBtn').onclick=()=>{\n  ['pdfOrg','pdfEmail','pdfPhone','pdfSite'].forEach(id=>S.set(id,document.getElementById(id).value.trim()));\n  toast('Dados do PDF salvos!','success');\n};\ndocument.getElementById('saveObjBtn').onclick=()=>{\n  S.set('objetivos',document.getElementById('objetivos').value.trim());\n  toast('Objetivos salvos!','success');\n};\n['perfil','nivel'].forEach(id=>document.getElementById(id).addEventListener('change',()=>S.set(id,document.getElementById(id).value)));\ndocument.getElementById('radarGlobal').addEventListener('change',e=>S.set('radarGlobal',e.target.checked));\ndocument.getElementById('userInput').addEventListener('input',function(){document.getElementById('cc').textContent=this.value.length+' chars'});\n\n// Collapsible\ndocument.getElementById('pdfToggle').onclick=()=>{\n  document.getElementById('pdfBody').classList.toggle('open');\n  document.getElementById('pdfIco').classList.toggle('open');\n};\n\n// ═══════════════════════════════════════════════\n//  MARKDOWN → HTML\n// ═══════════════════════════════════════════════\nfunction md2html(src){\n  const esc2=t=>String(t).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\n  const inline=raw=>{\n    let s=esc2(String(raw).replace(/[\\u0000\\u0001]/g,''));\n    const stash=[];const keep=h=>'\\u0001'+(stash.push(h)-1)+'\\u0001';\n    s=s.replace(/`([^`\\n]+)`/g,(m,c)=>keep('<code>'+c+'<\/code>'));\n    s=s.replace(/\\[([^\\]\\n]+)\\]\\((https?:\\/\\/[^\\s)]+)\\)/g,(m,t,u)=>keep('<a href=\"'+u+'\">'+t+'<\/a>'));\n    s=s.replace(/(^|[\\s(])(https?:\\/\\/[^\\s<)]+[^\\s<).,;:!?])/g,(m,p,u)=>p+keep('<a href=\"'+u+'\">'+u+'<\/a>'));\n    s=s.replace(/\\*\\*\\*([^*\\n]+?)\\*\\*\\*/g,'<strong><em>$1<\/em><\/strong>');\n    s=s.replace(/\\*\\*([^*\\n]+?)\\*\\*/g,'<strong>$1<\/strong>');\n    s=s.replace(/(^|[^\\w*])\\*([^*\\s](?:[^*\\n]*?[^*\\s])?)\\*(?![\\w*])/g,'$1<em>$2<\/em>');\n    s=s.replace(/(^|[^\\w])_([^_\\s](?:[^_\\n]*?[^_\\s])?)_(?![\\w])/g,'$1<em>$2<\/em>');\n    s=s.replace(/~~([^~\\n]+?)~~/g,'<del>$1<\/del>');\n    return s.replace(/\\u0001(\\d+)\\u0001/g,(m,i)=>stash[+i]);\n  };\n  const lines=String(src==null?'':src).replace(/\\r\\n?/g,'\\n').split('\\n');\n  const FENCE=/^\\s*```\\s*([\\w+#.-]*)\\s*$/,HEADING=/^\\s{0,3}(#{1,6})\\s+(.*?)\\s*#*\\s*$/,HR=/^\\s{0,3}([-*_])(\\s*\\1){2,}\\s*$/;\n  const LIST=/^(\\s*)([-*+•]|\\d+[.)])\\s+(.*)$/,TSEP=/^\\s*\\|?(\\s*:?-{2,}:?\\s*\\|)+(\\s*:?-{2,}:?\\s*)?$/;\n  const splitRow=l=>l.trim().replace(/^\\|/,'').replace(/\\|$/,'').split('|').map(c=>c.trim());\n  const isTbl=k=>k+1<lines.length&&lines[k].includes('|')&&TSEP.test(lines[k+1]);\n  const isBlock=k=>FENCE.test(lines[k])||HEADING.test(lines[k])||HR.test(lines[k])||/^\\s*>/.test(lines[k])||LIST.test(lines[k])||isTbl(k);\n  const buildList=items=>{\n    let h='';const st=[];\n    for(const it of items){\n      const tag=it.ordered?'ol':'ul';\n      while(st.length&&it.indent<st[st.length-1].indent)h+='<\/li><\/'+st.pop().tag+'>';\n      if(st.length&&it.indent===st[st.length-1].indent){\n        h+='<\/li>';\n        if(st[st.length-1].tag!==tag){h+='<\/'+st.pop().tag+'><'+tag+'>';st.push({indent:it.indent,tag})}\n      }else{h+='<'+tag+'>';st.push({indent:it.indent,tag})}\n      h+='<li>'+inline(it.text);\n    }\n    while(st.length)h+='<\/li><\/'+st.pop().tag+'>';\n    return h;\n  };\n  const out=[];let i=0;\n  while(i<lines.length){\n    const line=lines[i];\n    if(line.trim()===''){i++;continue}\n    let m=line.match(FENCE);\n    if(m){const lang=(m[1]||'text').toLowerCase();const buf=[];i++;\n      while(i<lines.length&&!/^\\s*```\\s*$/.test(lines[i])){buf.push(lines[i]);i++}\n      i++;out.push('<pre><code>'+esc2(buf.join('\\n'))+'<\/code><\/pre>');continue}\n    m=line.match(HEADING);\n    if(m){const lvl=Math.min(m[1].length+1,4);out.push('<h'+lvl+'>'+inline(m[2])+'<\/h'+lvl+'>');i++;continue}\n    if(HR.test(line)){out.push('<hr>');i++;continue}\n    if(/^\\s*>/.test(line)){const buf=[];\n      while(i<lines.length&&/^\\s*>/.test(lines[i])){buf.push(lines[i].replace(/^\\s*>\\s?/,''));i++}\n      out.push('<blockquote>'+md2html(buf.join('\\n'))+'<\/blockquote>');continue}\n    if(isTbl(i)){\n      const head=splitRow(lines[i]);\n      const al=splitRow(lines[i+1]).map(c=>/^:-+:$/.test(c)?'center':/^-+:$/.test(c)?'right':'');\n      i+=2;const rows=[];\n      while(i<lines.length&&lines[i].trim()!==''&&lines[i].includes('|')){rows.push(splitRow(lines[i]));i++}\n      const cell=(tag,t,k)=>'<'+tag+(al[k]?' style=\"text-align:'+al[k]+'\"':'')+'>'+inline(t||'')+'<\/'+tag+'>';\n      let t='<div style=\"overflow-x:auto\"><table><thead><tr>'+head.map((h,k)=>cell('th',h,k)).join('')+'<\/tr><\/thead><tbody>';\n      for(const r of rows)t+='<tr>'+head.map((_,k)=>cell('td',r[k],k)).join('')+'<\/tr>';\n      out.push(t+'<\/tbody><\/table><\/div>');continue}\n    if(LIST.test(line)){\n      const items=[];\n      while(i<lines.length){\n        const lm=lines[i].match(LIST);\n        if(lm){items.push({indent:lm[1].replace(/\\t/g,'    ').length,ordered:/\\d/.test(lm[2]),text:lm[3]});i++}\n        else if(lines[i].trim()!==''&&/^\\s{2,}\\S/.test(lines[i])&&items.length&&!isBlock(i)){items[items.length-1].text+=' '+lines[i].trim();i++}\n        else if(lines[i].trim()===''&&i+1<lines.length&&LIST.test(lines[i+1]))i++;\n        else break;\n      }\n      out.push(buildList(items));continue}\n    const buf=[];\n    while(i<lines.length&&lines[i].trim()!==''&&(buf.length===0||!isBlock(i))){buf.push(lines[i]);i++}\n    out.push('<p>'+buf.map(inline).join('<br>')+'<\/p>');\n  }\n  return out.join('');\n}\n\n// Sanitiza e injeta o markdown na área de resposta (links abrem em nova aba)\nfunction renderInto(el,md){\n  el.className='resp-body';\n  el.innerHTML=DOMPurify.sanitize(md2html(md));\n  el.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});\n}\n\n\n// ═══════════════════════════════════════════════\n//  GEMINI API\n// ═══════════════════════════════════════════════\n// ═══════════════════════════════════════════════\n//  PROMPT DO AGENTE (v2 — RCONT-SCT)\n// ═══════════════════════════════════════════════\nconst REF_CONTABIL = String.raw`PARÂMETROS DE REFERÊNCIA (conferidos em fontes públicas em 15/10/2026)\nUse como ponto de partida, não como substituto da fonte oficial. Se a busca na web ou o usuário trouxer dado mais recente, prevalece o mais recente e a divergência deve ser informada. Não reproduza de memória valores que não estejam aqui sem sinalizar a necessidade de conferência.\n\nPREVIDÊNCIA E FOLHA (2026)\n- Salário mínimo: R$ 1.621,00 (Decreto 12.797/2025). Teto do RGPS: R$ 8.475,55 (Portaria Interministerial MPS/MF 13/2026).\n- INSS do empregado, progressivo por faixa: 7,5% até R$ 1.621,00; 9% de R$ 1.621,01 a R$ 2.902,84; 12% de R$ 2.902,85 a R$ 4.354,27; 14% de R$ 4.354,28 a R$ 8.475,55. Contribuição máxima: R$ 988,09.\n- Sócio/contribuinte individual (pró-labore): 11% sobre o pró-labore até o teto (máximo R$ 932,31).\n- MEI: limite de R$ 81.000/ano; INSS de 5% do salário mínimo = R$ 81,05, mais R$ 1,00 de ICMS (comércio/indústria) e/ou R$ 5,00 de ISS (serviços) no DAS-MEI.\n\nIRPF/IRRF MENSAL (2026)\n- Tabela progressiva (alíquota; parcela a deduzir): até R$ 2.428,80 isento; até R$ 2.826,65: 7,5% (R$ 182,16); até R$ 3.751,05: 15% (R$ 394,16); até R$ 4.664,68: 22,5% (R$ 675,49); acima: 27,5% (R$ 908,73). Dedução por dependente: R$ 189,59. Desconto simplificado: R$ 607,20.\n- Redutor da Lei 15.270/2025 (imposto = tabela menos redutor, mínimo zero): R$ 312,89 para rendimento tributável até R$ 5.000,00; de R$ 5.000,01 a R$ 7.350,00: R$ 978,62 menos (0,133145 x rendimento); acima de R$ 7.350,00: sem redutor. Na prática, isenção até R$ 5.000/mês. Confirmar na norma a base exata de aplicação.\n\nLUCROS E DIVIDENDOS (Lei 15.270/2025, em vigor desde 1/1/2026)\n- IRRF de 10% quando a mesma pessoa jurídica paga, no mês, lucros/dividendos acima de R$ 50.000 a uma mesma pessoa física residente; o entendimento prevalente é de incidência sobre o total pago no mês, não apenas sobre o excedente. Remessas ao exterior: 10%.\n- IRPFM (tributação mínima anual) para renda total acima de R$ 600.000/ano, com redutor.\n- Transição: lucros apurados até o ano-calendário de 2025 com distribuição aprovada até 31/12/2025 (condições cumulativas) mantêm a isenção.\n- Simples Nacional: a Receita Federal entende que a retenção se aplica também às optantes; há controvérsia jurídica pela isenção do art. 14 da LC 123/2006. Apresente as duas posições, o risco de cada caminho e recomende parecer jurídico em valores relevantes.\n- JCP: 15% na fonte (conferir se houve alteração).\n\nLUCRO PRESUMIDO\n- IRPJ 15% mais adicional de 10% sobre a parcela da base acima de R$ 20.000/mês (R$ 60.000/trimestre); CSLL 9%; PIS 0,65% e Cofins 3,00% no regime cumulativo (sem créditos) até a extinção prevista para 2027. Limite de opção: R$ 78 milhões/ano.\n- Presunções usuais do IRPJ: 1,6% (revenda de combustíveis); 8% (comércio, indústria, transporte de cargas, serviços hospitalares); 16% (transporte de passageiros e algumas atividades); 32% (serviços em geral, intermediação, administração e locação). CSLL: 12% (comércio, indústria e atividades equiparadas) e 32% (serviços em geral). Conferir o enquadramento por atividade.\n- LC 224/2025 (Decreto 12.808/2025; IN RFB 2.305/2025): acréscimo de 10% sobre o percentual de presunção (por exemplo 32% para 35,2%; 8% para 8,8%; 12% para 13,2%) somente sobre a parcela da receita bruta que excede R$ 5.000.000/ano (R$ 1.250.000/trimestre). IRPJ desde 1/1/2026; CSLL desde 1/4/2026 (noventena). Receitas financeiras e ganhos de capital não entram no limite. Atividades mistas: proporcional; ajuste no último trimestre.\n\nSIMPLES NACIONAL (tabelas vigentes em 2026)\n- Limite R$ 4.800.000/ano; sublimite de R$ 3.600.000 para ICMS/ISS (mantido para 2026 pela Portaria CGSN 54/2025). Fator R = folha dos 12 meses (salários, pró-labore, 13º, FGTS e CPP, conforme art. 18, §24, da LC 123/2006 - conferir) dividida pela RBT12: 28% ou mais = Anexo III; abaixo = Anexo V.\n- Alíquota efetiva = (RBT12 x alíquota nominal - parcela a deduzir) / RBT12.\n- Anexo I (comércio), faixas de RBT12 em R$: até 180 mil: 4,00%; até 360 mil: 7,30% (5.940); até 720 mil: 9,50% (13.860); até 1,8 mi: 10,70% (22.500); até 3,6 mi: 14,30% (87.300); até 4,8 mi: 19,00% (378.000).\n- Anexo II (indústria): 4,50%; 7,80% (5.940); 10,00% (13.860); 11,20% (22.500); 14,70% (85.500); 30,00% (720.000).\n- Anexo III (serviços com Fator R >= 28% e outros): 6,00%; 11,20% (9.360); 13,50% (17.640); 16,00% (35.640); 21,00% (125.640); 33,00% (648.000).\n- Anexo IV (construção, vigilância, limpeza, advocacia e outros; CPP patronal de 20% recolhida fora do DAS): 4,50%; 9,00% (8.100); 10,20% (12.420); 14,00% (39.780); 22,00% (183.780); 33,00% (828.000).\n- Anexo V (serviços com Fator R < 28%): 15,50%; 18,00% (4.500); 19,50% (9.900); 20,50% (17.100); 23,00% (62.100); 30,50% (540.000).\n- Recorrências: DAS/PGDAS-D até o dia 20 do mês seguinte; DEFIS até 31/3; DASN-SIMEI até 31/5; DCTFWeb até o dia 15.\n- Adequação à reforma (verificado): Resoluções CGSN 190/2026 (incorpora IBS e CBS ao Simples a partir de 1/1/2027; sublimite de R$ 3,6 mi passa a abranger o IBS, com limite adicional de R$ 3,6 mi para exportações; faturamento reconhecido na emissão do documento fiscal), 191/2026 (NFS-e padrão nacional obrigatória para ME/EPP optantes a partir de 1/11/2026), 192/2026 (partilha com o CGIBS) e 194/2026 (prazos).\n- Prazos para 2027 (Res. CGSN 194/2026): ingresso/retorno ao Simples até 15/10/2026 (regularização de pendências até 30/10/2026); opção pelo regime regular de IBS/CBS (\"Simples híbrido\") para jan-jun/2027 entre 1/9 e 30/10/2026; cancelamento irretratável das opções entre 3/11 e 20/12/2026; nova janela de opção para o 2º semestre de 2027 em março/2027 (confirmar). Quem não opta permanece com IBS/CBS dentro do DAS.\n\nREFORMA TRIBUTÁRIA DO CONSUMO\n- Marco normativo: EC 132/2023; LC 214/2025 (16/1/2025: IBS, CBS e Imposto Seletivo); LC 227/2026 (13/1/2026, DOU de 14/1/2026: Comitê Gestor do IBS, contencioso administrativo, ITCMD e alterações na LC 214); Decreto 12.955/2026 (regulamento da CBS, 30/4/2026); Resolução CGIBS 6/2026 (regulamento do IBS).\n- Cronograma: 2026 = teste, com CBS de 0,9% e IBS de 0,1% destacados nos documentos fiscais, compensáveis com tributos atuais e com dispensa de recolhimento para quem cumprir as obrigações acessórias (art. 348, §1º, LC 214 - confirmar); 2027 = CBS em alíquota plena, extinção de PIS/Cofins, início do Imposto Seletivo e IPI com alíquota zero (salvo regime da Zona Franca de Manaus); IBS permanece em teste (confirmar alíquota); 2029 a 2032 = redução gradual de ICMS e ISS (9/10, 8/10, 7/10 e 6/10 das alíquotas) com aumento proporcional do IBS; 2033 = sistema pleno e extinção de ICMS e ISS.\n- Alíquotas de referência definitivas de CBS/IBS, regimes específicos, split payment e regras de crédito: sempre confirmar na fonte oficial antes de afirmar números ou datas.`;\n\nfunction buildSysPrompt(perfil,nivel,radar,obj,opts){\n  opts=opts||{};const web=!!opts.web;\n  const hoje=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});\n\n  const intro=`Você é o Agente Estratégico 360° do escritório RCONT-SCT (Soluções Contábeis e Tributárias), assistente de análise usado pelo contador responsável e pela equipe. Entrega análises estratégicas acionáveis, rigorosas e honestas, sempre em português do Brasil. Data atual do aplicativo: ${hoje}.`;\n\n  const pm={\n    Contador:`PERFIL ATIVO: CONTADOR ESTRATÉGICO.\nAtue como contador sênior (CRC), tributarista e controller. Domínio: contabilidade societária e gerencial (CPC/NBC, IFRS), planejamento tributário lícito e comparativo de regimes (Simples Nacional, Lucro Presumido, Lucro Real), reforma tributária do consumo (IBS, CBS e Imposto Seletivo), Lei 15.270/2025 (lucros, dividendos e IRPF), LC 224/2025, folha e eSocial, SPED, compliance e LGPD, governança, custos, fluxo de caixa, valuation, holding e sucessão, due diligence e gestão de escritório contábil (carteira, precificação, serviços consultivos). Transforme o caso em decisão: quantifique quando houver dados, mostre a conta, a base legal e o risco. Distinga planejamento lícito de evasão e aponte quando a medida exige parecer jurídico.`,\n    Estrategista:`PERFIL ATIVO: ESTRATEGISTA EMPRESARIAL.\nDomínio: estratégia corporativa e de negócios, análise competitiva e de mercado, modelo de negócio e proposta de valor, unit economics e precificação, inovação, operações, pessoas e cultura, M&A e parcerias, OKRs e KPIs. Escolha apenas os frameworks que realmente se aplicam ao caso (por exemplo SWOT, Cinco Forças, Business Model Canvas, Jobs to be Done, Oceano Azul, matriz impacto x esforço, análise de cenários) e aplique-os de fato; não os cite sem usar.`,\n    Investidor:`PERFIL ATIVO: ANALISTA DE INVESTIMENTOS.\nDomínio: análise fundamentalista e macroeconômica, valuation (fluxo de caixa descontado, múltiplos, soma das partes), risco e retorno, diversificação e alocação, renda fixa e variável, crédito, imobiliário, tributação de investimentos no Brasil e finanças comportamentais. Apresente tese e contra-tese, premissas explícitas, sensibilidades e gatilhos de revisão. ${web?'Quando precisar de cotações, taxas ou indicadores atuais, use a pesquisa na web e informe fonte e data; sem fonte confiável, indique \"confirmar no mercado\".':'Você não tem cotações nem notícias em tempo real nesta chamada: não apresente preços, taxas ou indicadores atuais como fatos; indique \"confirmar no mercado\".'} Trate o conteúdo como análise, não como recomendação individual de compra ou venda.`\n  };\n\n  const nm={\n    '1':'NÍVEL 1 — ATUALIZADO: resposta direta e objetiva, linguagem clara e melhores práticas vigentes, em torno de 600 palavras. Entregue resumo executivo, pontos principais e próximos passos.',\n    '2':'NÍVEL 2 — DIFERENCIADO: análise aprofundada, em torno de 900 a 1.200 palavras, com comparações, riscos e oportunidades específicos do caso e insights além do óbvio.',\n    '3':'NÍVEL 3 — ELITE ESTRATÉGICO: análise multidimensional, em torno de 1.500 a 2.200 palavras, com cenários (base, favorável e adverso) e seus gatilhos, matriz de riscos, plano de ação priorizado com prazos e indicadores, e visão de longo prazo.',\n    '4':'NÍVEL 4 — REFERÊNCIA GLOBAL: tudo do nível 3, em torno de 2.000 a 3.000 palavras, mais benchmarking internacional, tendências macro e setoriais, lições de outros mercados e visão de 3 a 10 anos que posicione o cliente como referência no setor.'\n  };\n\n  let p=`${intro}\\n\\n${pm[perfil]||pm.Estrategista}\\n\\n${nm[nivel]||nm['1']}\\n\\n`;\n  if(radar)p+=`RADAR GLOBAL ATIVO: inclua contexto internacional, tendências e benchmarks mundiais relevantes, separando o que é tendência consolidada do que é hipótese. ${web?'Confirme os dados internacionais na pesquisa e cite a fonte.':'Sem acesso à internet nesta chamada, não apresente dados numéricos atuais de outros países como certos.'}\\n\\n`;\n  if(obj&&obj.trim())p+=`CONTEXTO E OBJETIVOS DO USUÁRIO (use para calibrar prioridades e recomendações):\\n${obj.trim()}\\n\\n`;\n\n  p+=`COMO ANALISAR\n1. Identifique a decisão real por trás da consulta e responda a ela.\n2. Separe fatos informados, premissas assumidas e hipóteses. Se faltar dado essencial, declare a premissa adotada e diga como a conclusão muda se ela falhar; não devolva apenas perguntas.\n3. Considere o contexto brasileiro (tributário, regulatório, trabalhista, cambial e de crédito) quando aplicável.\n4. Quantifique quando houver dados: mostre a conta (fórmula, entradas e resultado) e confira a aritmética antes de concluir.\n5. Apresente o contraditório: o que pode dar errado, o argumento mais forte contra a recomendação e o que faria mudar de ideia.\n6. Priorize: poucas recomendações de alto impacto, em ordem, com prazo, responsável sugerido e indicador de sucesso.\n\nINTEGRIDADE\nNunca invente números, normas, artigos, jurisprudência, fontes, empresas ou estatísticas. ${web?'Esta chamada tem PESQUISA NA WEB ATIVA: use-a para confirmar vigência, prazos, alíquotas, taxas, cotações e normas que mudam com o tempo, priorizando fontes oficiais (planalto.gov.br, gov.br/receitafederal, cgibs.gov.br, Portal do Simples Nacional, in.gov.br, bcb.gov.br, cvm.gov.br) e informando a identificação e a data da norma. Distinga o que veio da pesquisa do que é inferência sua e, se a pesquisa não confirmar um dado, sinalize \"(confirmar na fonte oficial)\". Nunca afirme ter consultado o que não consultou.':'Esta chamada não tem acesso à internet: sinalize com \"(confirmar na fonte oficial)\" todo dado que muda com o tempo (alíquotas, prazos, taxas, índices, cotações, regulamentos).'} Diferencie regra vigente, regra aprovada com transição, proposta e opinião. Se não souber, diga que não sabe. Não prometa economia nem resultado.\n\nESTRUTURA DA RESPOSTA (ajuste a profundidade ao nível; omita a seção que não tiver conteúdo útil)\n## Resumo executivo\nConclusão e recomendação principal em 3 a 5 linhas.\n## Diagnóstico do cenário\nFatos, premissas e o que ainda falta saber.\n## Análise\nSubseções (###) por dimensão relevante ao caso; use tabela quando comparar alternativas.\n## Riscos e pontos de atenção\nPreferir tabela: Risco | Probabilidade | Impacto | Mitigação.\n## Cenários\nTabela com cenário base, favorável e adverso e seus gatilhos (níveis 3 e 4).\n## Plano de ação\nPreferir tabela: Ação | Prazo | Responsável sugerido | Indicador.\n## Premissas, limites e confirmações necessárias\n\nFORMATAÇÃO (o aplicativo renderiza Markdown)\nUse ## e ###, **negrito**, listas com \"-\" ou \"1.\" (no máximo um nível de aninhamento), \">\" para destaques, \"---\" para separadores e TABELAS Markdown (| col | col |, com linha de separação |---|---|) para comparações, cenários, matriz de riscos e plano de ação: no máximo 5 colunas, células curtas, valores alinhados. NÃO use HTML, LaTeX nem blocos de código. Valores em reais no formato brasileiro (R$ 1.234,56) e percentuais com vírgula. Sem emojis. Não repita a consulta. Não use ressalvas genéricas; apenas as que mudam a decisão.\n\n${opts.files?'ARQUIVOS ANEXADOS\\nOs arquivos chegam como [ARQUIVO ANEXADO: nome] (planilhas convertidas em CSV por aba; PDFs e imagens como arquivo). Baseie-se no conteúdo efetivamente lido, cite de onde veio cada número (arquivo, aba ou campo), aponte o que não foi possível ler e não invente campos ausentes. Em XML de NF-e, NFS-e ou CT-e extraia emitente, destinatário, itens, NCM/NBS, CFOP, CST/CSOSN, valores, tributos e, em 2026, os grupos de CBS/IBS.\\n\\n':''}INTEGRAÇÃO COM O CHAT\nEste agente complementa o Chat Contábil do mesmo aplicativo (que lê XML, PDF e planilhas e permite conversa iterativa). Quando a consulta pedir conversa iterativa, cálculo passo a passo ou ajustes sucessivos, sugira em uma linha continuar no Chat (botão \"Continuar no Chat\"), que mantém os anexos.`;\n\n  if(perfil==='Contador')p+=`\\n\\n${REF_CONTABIL}`;\n  return p;\n}\n\nconst AG_CFG={USAR_BUSCA_WEB:true,ALERTAR_CPF:true,MAX_TOKENS:32768,MAX_TOKENS_FALLBACK:8192,MAX_HIST:60,TIMEOUT_MS:240000};\nconst THINK_BY_NIVEL={'1':'low','2':'medium','3':'high','4':'high'};\n\nfunction agParts(msg,files){\n  const parts=[];\n  for(const a of (files||[])){\n    if(a.kind==='text')parts.push({text:`[ARQUIVO ANEXADO: ${a.name}]\\n${a.text}\\n[FIM DO ARQUIVO: ${a.name}]`});\n    else{parts.push({text:`[ARQUIVO ANEXADO: ${a.name}]`});parts.push({inlineData:{mimeType:a.mime,data:a.data}})}\n  }\n  parts.push({text:msg});\n  return parts;\n}\n\nfunction agSourcesMd(sources){\n  const seen=new Set(),items=[];\n  for(const s of (sources||[])){\n    if(!s||!s.uri||seen.has(s.uri))continue;seen.add(s.uri);\n    const t=String(s.title||s.uri).replace(/[\\[\\]\\n]/g,' ').trim().slice(0,90);\n    items.push(`- [${t}](${s.uri})`);\n    if(items.length>=8)break;\n  }\n  return items.length?`\\n\\n---\\n\\n**Fontes consultadas na web**\\n${items.join('\\n')}`:'';\n}\n\nasync function callGemini(key,sysArg,msg,opts){\n  opts=opts||{};\n  const sysFor=typeof sysArg==='function'?sysArg:(()=>sysArg);\n  const model=sharedModel();\n  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;\n  const level=THINK_BY_NIVEL[opts.nivel]||'medium';\n  const contents=[{role:'user',parts:agParts(msg,opts.files)}];\n\n  // pedido completo primeiro; se a API recusar um recurso opcional, degrada em etapas\n  const variants=[];\n  if(AG_CFG.USAR_BUSCA_WEB)variants.push({search:true,thinking:true,max:AG_CFG.MAX_TOKENS});\n  variants.push({search:false,thinking:true,max:AG_CFG.MAX_TOKENS});\n  variants.push({search:false,thinking:false,max:AG_CFG.MAX_TOKENS});\n  variants.push({search:false,thinking:false,max:AG_CFG.MAX_TOKENS_FALLBACK});\n\n  const ctl=new AbortController();\n  const to=setTimeout(()=>ctl.abort(),AG_CFG.TIMEOUT_MS);\n  let lastErr=null;\n  try{\n    for(const v of variants){\n      const gc={maxOutputTokens:v.max};\n      if(v.thinking)gc.thinkingConfig={thinkingLevel:level};\n      const body={systemInstruction:{parts:[{text:sysFor(v.search)}]},contents,generationConfig:gc};\n      if(v.search)body.tools=[{google_search:{}}];\n      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body),signal:ctl.signal});\n      let d={};try{d=await r.json()}catch(e){}\n      if(r.ok){\n        const cand=d.candidates?.[0];\n        let t=(cand?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('').trim();\n        if(!t)throw new Error(d.promptFeedback?.blockReason?`Pedido bloqueado pela API (${d.promptFeedback.blockReason})`:'Resposta vazia da API');\n        if(cand.finishReason==='MAX_TOKENS')t+='\\n\\n> Resposta interrompida por limite de tamanho. Reduza o nível ou divida a consulta.';\n        const gm=cand.groundingMetadata||{};\n        const sources=(gm.groundingChunks||[]).map(c=>c.web).filter(w=>w&&w.uri).map(w=>({uri:w.uri,title:w.title||w.uri}));\n        const web=v.search&&(sources.length>0||!!(gm.webSearchQueries&&gm.webSearchQueries.length));\n        if(AG_CFG.USAR_BUSCA_WEB&&!v.search)toast('Busca na web indisponível nesta chamada (chave sem faturamento ou sem cota). Análise sem fontes atuais.','warning',6000);\n        return {text:t,sources,web};\n      }\n      lastErr=new Error(d.error?.message||`Erro HTTP ${r.status}`);lastErr.status=r.status;\n      const m=(d.error?.message||'').toLowerCase();\n      const recuperavel=(r.status===429?v.search:[400,403].includes(r.status))&&!/api key|api_key/.test(m);\n      if(!recuperavel)throw lastErr;\n    }\n    throw lastErr;\n  }catch(e){\n    if(e&&e.name==='AbortError')throw new Error('Tempo esgotado sem resposta da API. Tente novamente ou reduza o nível.');\n    throw e;\n  }finally{clearTimeout(to)}\n}\n\n// ═══ Modelo e chave compartilhados com o Chat Contábil ═══\nfunction sharedModel(){return S.get('gemini_model_name')||'gemini-3.8-flash'}\nfunction getKey(){return S.get('apiKey')||S.get('gemini_api_key')}\n\n// ═══════════════════════════════════════════════\n//  ANALISAR\n// ═══════════════════════════════════════════════\nconst ldgMsgs=['Processando análise…','Consultando base de dados…','Estruturando insights…','Finalizando relatório…'];\nlet ldgIdx=0, ldgTimer=null;\n\ndocument.getElementById('analisarBtn').onclick=async()=>{\n  const key=getKey();\n  if(!key){toast('Configure a API Key do Gemini.','error');return}\n  const query=document.getElementById('userInput').value.trim();\n  if(!query){toast('Digite uma consulta.','warning');return}\n\n  const perfil=document.getElementById('perfil').value;\n  const nivel=document.getElementById('nivel').value;\n  const radar=document.getElementById('radarGlobal').checked;\n  const obj=document.getElementById('objetivos').value.trim();\n\n  // UI: show loading\n  document.getElementById('analisarBtn').disabled=true;\n  document.getElementById('loading').classList.add('vis');\n  document.getElementById('respWrap').style.display='none';\n  document.getElementById('dashCard').style.display='none';\n\n  ldgIdx=0;\n  ldgTimer=setInterval(()=>{\n    ldgIdx=(ldgIdx+1)%ldgMsgs.length;\n    document.getElementById('ldgTxt').textContent=ldgMsgs[ldgIdx];\n  },2400);\n\n  const t0=Date.now();\n  try{\n    let q=query;const files=pendingFiles.slice();let sendFiles=files;\n    if(AG_CFG.ALERTAR_CPF){\n      const tq=maskCPFs(q);let found=tq.found;\n      const mf=files.map(a=>{if(a.kind!=='text')return a;const m=maskCPFs(a.text);if(m.found)found=true;return{...a,text:m.text}});\n      if(found&&confirm('Detectei CPF no texto ou nos anexos.\\n\\nOK = enviar à IA com o CPF mascarado (***.***.***-DV)\\nCancelar = enviar como está')){q=tq.text;sendFiles=mf}\n    }\n    const res=await callGemini(key,(web)=>buildSysPrompt(perfil,nivel,radar,obj,{web,files:sendFiles.length>0}),q,{files:sendFiles,nivel});\n    const raw=res.text+agSourcesMd(res.sources);\n    window.lastRaw=raw;window.lastQuery=query;window.lastFiles=files;\n    clearInterval(ldgTimer);\n    const elapsed=((Date.now()-t0)/1000).toFixed(1);\n\n    const rEl=document.getElementById('response');\n    renderInto(rEl,raw);\n\n    document.getElementById('respTime').textContent=elapsed+'s';\n    const badge=document.getElementById('respBadge');\n    badge.textContent=`${perfil} · Nível ${nivel}${res.web?' · web':''}`;\n    badge.style.display='inline-flex';\n    document.getElementById('respWrap').style.display='block';\n\n    updateDash(raw,elapsed,nivel);\n    addHist(query,raw,perfil,nivel,files.map(f=>f.name),res.web);\n    pendingFiles=[];renderChips();\n    toast('Análise concluída!','success');\n  }catch(e){\n    clearInterval(ldgTimer);\n    const rEl=document.getElementById('response');\n    rEl.className='resp-body';\n    rEl.innerHTML=`<div style=\"color:var(--red)\"><strong>Erro:<\/strong> ${e.message}<\/div>`;\n    document.getElementById('respWrap').style.display='block';\n    toast('Erro: '+e.message,'error',5000);\n  }finally{\n    document.getElementById('analisarBtn').disabled=false;\n    document.getElementById('loading').classList.remove('vis');\n  }\n};\n\n// ═══════════════════════════════════════════════\n//  DASHBOARD\n// ═══════════════════════════════════════════════\nfunction updateDash(text,elapsed,nivel){\n  const words=text.split(/\\s+/).filter(Boolean).length;\n  const secs=(text.match(/##/g)||[]).length+1;\n  const nlabels={'1':'Atualizado','2':'Diferenciado','3':'Elite','4':'Global'};\n  const ms=[\n    {v:words.toLocaleString('pt-BR'),l:'Palavras'},\n    {v:elapsed+'s',l:'Tempo de Resposta'},\n    {v:secs,l:'Seções Identificadas'},\n    {v:nlabels[nivel]||nivel,l:'Nível Aplicado'}\n  ];\n  document.getElementById('dashboard').innerHTML=ms.map(m=>`\n    <div class=\"mc\"><div class=\"mv\">${m.v}<\/div><div class=\"ml\">${m.l}<\/div><\/div>`).join('');\n\n  // Keywords\n  const stops=new Set(['de','da','do','e','em','para','com','que','se','por','no','na','os','as','um','uma','é','são','foi','ser','ter','mas','ou','quando','como','ele','ela','este','esta','isso','essa','esse','o','a','ao','às','dos','das','nos','nas','pelo','pela','entre','mais','também','já','não','seu','sua','seus','suas','cada','todo','toda','todos','todas','muito','pode','deve']);\n  const freq={};\n  text.toLowerCase().replace(/[^a-záéíóúâêîôûãõàèìòù\\s]/g,' ').split(/\\s+/).filter(w=>w.length>4&&!stops.has(w)).forEach(w=>freq[w]=(freq[w]||0)+1);\n  const kws=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([w])=>w[0].toUpperCase()+w.slice(1)).join(' · ');\n\n  const kw=document.getElementById('kwSection');\n  kw.innerHTML=kws?`<div style=\"margin-top:12px;padding-top:12px;border-top:1px solid var(--border)\"><div style=\"font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px\">Termos-Chave<\/div><div style=\"font-size:12px;color:var(--dim);font-family:'JetBrains Mono',monospace\">${kws}<\/div><\/div>`:'';\n\n  document.getElementById('dashCard').style.display='block';\n}\n\n// ═══════════════════════════════════════════════\n//  HISTORY\n// ═══════════════════════════════════════════════\n// ═══════════════════════════════════════════════\n//  HISTÓRICO COMPLETO (IndexedDB) — guarda a análise inteira\n// ═══════════════════════════════════════════════\nconst AH={\n  db:null,cache:[],ready:null,\n  open(){\n    this.ready=new Promise(res=>{\n      try{\n        if(!window.indexedDB)return res(false);\n        const r=indexedDB.open('rcont_agente',1);\n        r.onupgradeneeded=()=>r.result.createObjectStore('hist',{keyPath:'id'});\n        r.onsuccess=()=>{this.db=r.result;res(true)};\n        r.onerror=()=>res(false);\n      }catch(e){res(false)}\n    }).then(async ok=>{if(ok)await this.migrate();await this.load();return ok});\n    return this.ready;\n  },\n  _tx(mode,fn){\n    return new Promise(res=>{\n      if(!this.db)return res(null);\n      try{\n        const tx=this.db.transaction('hist',mode);const rq=fn(tx.objectStore('hist'));\n        tx.oncomplete=()=>res(rq&&rq.result!==undefined?rq.result:true);\n        tx.onerror=()=>res(null);tx.onabort=()=>res(null);\n      }catch(e){res(null)}\n    });\n  },\n  async load(){\n    if(this.db){this.cache=((await this._tx('readonly',s=>s.getAll()))||[]).sort((a,b)=>b.ts-a.ts)}\n    else{this.cache=S.getJ('history',[]).map((h,i)=>({id:'ls'+i,query:h.query,resp:h.resp,perfil:h.perfil,nivel:h.nivel,ts:+new Date(h.ts)||0,truncated:(h.resp||'').length>=600,files:[]}))}\n  },\n  async migrate(){\n    if(S.get('hist_migrated'))return;\n    for(const h of S.getJ('history',[])){\n      const ts=+new Date(h.ts)||Date.now();\n      await this._tx('readwrite',s=>s.put({id:'m'+ts,query:h.query,resp:h.resp,perfil:h.perfil,nivel:h.nivel,ts,truncated:(h.resp||'').length>=600,files:[]}));\n    }\n    S.set('hist_migrated','1');\n  },\n  async add(item){\n    item.id='a'+item.ts;\n    if(this.db){\n      await this._tx('readwrite',s=>s.put(item));\n      const all=((await this._tx('readonly',s=>s.getAll()))||[]).sort((a,b)=>b.ts-a.ts);\n      for(const old of all.slice(AG_CFG.MAX_HIST))await this._tx('readwrite',s=>s.delete(old.id));\n    }else{\n      let h=S.getJ('history',[]);\n      h.unshift({query:item.query,resp:item.resp.slice(0,600),perfil:item.perfil,nivel:item.nivel,ts:new Date(item.ts).toISOString()});\n      S.setJ('history',h.slice(0,MAX_HIST));\n    }\n    await this.load();\n  },\n  async clear(){if(this.db)await this._tx('readwrite',s=>s.clear());S.setJ('history',[]);this.cache=[]}\n};\n\nasync function addHist(query,resp,perfil,nivel,files,web){\n  await AH.add({query,resp,perfil,nivel,ts:Date.now(),files:files||[],web:!!web,truncated:false});\n  renderHistory();\n}\nfunction renderHistory(){\n  const h=AH.cache;\n  const c=document.getElementById('hlist');\n  if(!h.length){\n    c.innerHTML=`<div class=\"empty\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M12 8v4l3 3\"/><circle cx=\"12\" cy=\"12\" r=\"10\"/><\/svg><p>Nenhuma consulta no histórico<\/p><\/div>`;\n    return;\n  }\n  c.innerHTML=h.map((it,i)=>{\n    const d=new Date(it.ts);\n    const ds=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});\n    const ts=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});\n    const num=['①','②','③','④'][+it.nivel-1]||'◎';\n    return`<div class=\"hi\" onclick=\"loadHist(${i})\">\n      <div class=\"hico\">${num}<\/div>\n      <div class=\"hc\">\n        <div class=\"hq\">${esc(it.query.slice(0,85))}${it.query.length>85?'…':''}<\/div>\n        <div class=\"hm\"><span>${ds} ${ts}<\/span><span>·<\/span><span>${esc(it.perfil)}<\/span>${(it.files&&it.files.length)?'<span>·<\/span><span>📎'+it.files.length+'<\/span>':''}<\/div>\n      <\/div>\n    <\/div>`;\n  }).join('');\n}\nfunction loadHist(i){\n  const it=AH.cache[i];if(!it)return;\n  window.lastRaw=it.resp;window.lastQuery=it.query;window.lastFiles=[];\n  document.getElementById('userInput').value=it.query;\n  document.getElementById('cc').textContent=it.query.length+' chars';\n  const rEl=document.getElementById('response');\n  renderInto(rEl,it.resp);\n  const notes=[];\n  if(it.truncated)notes.push('⋯ análise antiga truncada no histórico — reanalisar para a resposta completa');\n  if(it.files&&it.files.length)notes.push('Anexos desta análise (não restaurados): '+it.files.map(esc).join(', '));\n  if(notes.length)rEl.insertAdjacentHTML('beforeend','<p style=\"color:var(--dim);font-style:italic;font-size:12px;margin-top:12px\">'+notes.join('<br>')+'<\/p>');\n  const badge=document.getElementById('respBadge');\n  badge.textContent=`${it.perfil} · Nível ${it.nivel}${it.web?' · web':''}`;badge.style.display='inline-flex';\n  document.getElementById('respTime').textContent='';\n  document.getElementById('respWrap').style.display='block';\n  toast('Análise carregada do histórico','info');\n}\ndocument.getElementById('clearHistBtn').onclick=async()=>{\n  if(confirm('Limpar todo o histórico?')){await AH.clear();renderHistory();toast('Histórico limpo','success')}\n};\n\n// ═══════════════════════════════════════════════\n//  ANEXOS (XML, PDF, planilhas, texto, imagens)\n// ═══════════════════════════════════════════════\nlet pendingFiles=[];\nconst FILE_RULES={\n  text:['xml','csv','tsv','txt','json','md','ofx','html','htm','log'],\n  sheet:['xlsx','xls','xlsm','ods'],\n  inline:{pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp'},\n  maxFileBytes:20*1024*1024,maxInlineTotal:15*1024*1024,maxTextChars:500000\n};\nfunction readBuffer(file){\n  if(file.arrayBuffer)return file.arrayBuffer();\n  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsArrayBuffer(file)});\n}\nfunction decodeBuffer(buf){\n  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1252').decode(buf)}\n}\nfunction toBase64(buf){\n  const b=new Uint8Array(buf);let bin='';\n  for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));\n  return btoa(bin);\n}\nfunction loadSheetLib(){\n  return new Promise((res,rej)=>{\n    if(window.XLSX)return res();\n    const s=document.createElement('script');\n    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';\n    s.onload=()=>res();s.onerror=()=>rej(new Error('Não foi possível carregar o leitor de planilhas (sem internet?)'));\n    document.head.appendChild(s);\n  });\n}\nfunction capText(t){return t.length<=FILE_RULES.maxTextChars?t:t.slice(0,FILE_RULES.maxTextChars)+`\\n[... arquivo truncado: exibidos ${FILE_RULES.maxTextChars} de ${t.length} caracteres ...]`}\nasync function processFile(file){\n  const ext=(file.name.split('.').pop()||'').toLowerCase();\n  if(file.size>FILE_RULES.maxFileBytes)throw new Error(`${file.name}: maior que 20 MB`);\n  const base={name:file.name,size:file.size};\n  if(FILE_RULES.text.includes(ext))return{...base,kind:'text',text:capText(decodeBuffer(await readBuffer(file)))};\n  if(FILE_RULES.sheet.includes(ext)){\n    await loadSheetLib();\n    const wb=window.XLSX.read(await readBuffer(file),{type:'array'});\n    let out='';\n    for(const sn of wb.SheetNames)out+=`### Aba: ${sn}\\n${window.XLSX.utils.sheet_to_csv(wb.Sheets[sn])}\\n\\n`;\n    return{...base,kind:'text',text:capText(out.trim())};\n  }\n  if(FILE_RULES.inline[ext])return{...base,kind:'inline',mime:FILE_RULES.inline[ext],data:toBase64(await readBuffer(file))};\n  throw new Error(`${file.name}: formato não suportado (use XML, PDF, XLSX/XLS, CSV, TXT, JSON ou imagem)`);\n}\nasync function addFiles(list){\n  for(const f of Array.from(list||[])){\n    try{\n      const att=await processFile(f);\n      const tot=[...pendingFiles,att].filter(a=>a.kind==='inline').reduce((n,a)=>n+a.size,0);\n      if(tot>FILE_RULES.maxInlineTotal)throw new Error(`${f.name}: PDFs/imagens somados passam de 15 MB`);\n      pendingFiles.push(att);\n    }catch(e){toast(e.message||'Falha ao ler o arquivo','warning',5000)}\n  }\n  renderChips();\n  const fi=document.getElementById('fileInput');if(fi)fi.value='';\n}\nfunction fmtSize(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}\nfunction renderChips(){\n  const box=document.getElementById('attachChips');if(!box)return;\n  box.innerHTML='';box.style.display=pendingFiles.length?'flex':'none';\n  pendingFiles.forEach((a,idx)=>{\n    const chip=document.createElement('span');chip.className='attach-chip';\n    chip.textContent=`📎 ${a.name} (${fmtSize(a.size)})`;\n    const x=document.createElement('button');x.type='button';x.textContent='×';x.title='Remover anexo';\n    x.onclick=()=>{pendingFiles.splice(idx,1);renderChips()};\n    chip.appendChild(x);box.appendChild(chip);\n  });\n}\nfunction isValidCPF(d){\n  if(!/^\\d{11}$/.test(d)||/^(\\d)\\1{10}$/.test(d))return false;\n  for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=Number(d[i])*(t+1-i);if(((s*10)%11)%10!==Number(d[t]))return false}\n  return true;\n}\nfunction maskCPFs(text){\n  let found=false;\n  const masked=text.replace(/(^|[^\\d.\\/-])(\\d{3})\\.?(\\d{3})\\.?(\\d{3})-?(\\d{2})(?![\\d])/g,(m,pre,a,b,c,dv)=>{\n    if(!isValidCPF(a+b+c+dv))return m;found=true;return `${pre}***.***.***-${dv}`;\n  });\n  return{text:masked,found};\n}\ndocument.addEventListener('dragover',e=>{if(e.dataTransfer&&e.dataTransfer.types&&e.dataTransfer.types.includes('Files'))e.preventDefault()});\ndocument.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){e.preventDefault();addFiles(e.dataTransfer.files)}});\ndocument.getElementById('attachBtn').onclick=()=>document.getElementById('fileInput').click();\ndocument.getElementById('fileInput').onchange=e=>addFiles(e.target.files);\n\n\n// Copy\ndocument.getElementById('copyBtn').onclick=()=>{\n  const t=document.getElementById('response').innerText;\n  if(!t||t.includes('Nenhuma análise')){toast('Nenhuma análise para copiar','warning');return}\n  navigator.clipboard.writeText(t).then(()=>toast('Copiado!','success'));\n};\n\n// Perplexity\ndocument.getElementById('perplexityBtn').onclick=()=>{\n  const q=document.getElementById('userInput').value.trim();\n  window.open(q?`https://www.perplexity.ai/search?q=${encodeURIComponent(q)}`:'https://www.perplexity.ai','_blank');\n};\n\nfunction esc(s){return s.replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;')}\n\n// ═══════════════════════════════════════════════\n//  PDF EXPORT\n// ═══════════════════════════════════════════════\ndocument.getElementById('exportBtn').onclick=exportPDF;\n\nfunction exportPDF(){\n  const rEl=document.getElementById('response');\n  if(!rEl||rEl.classList.contains('empty')||!rEl.innerHTML.trim()){\n    toast('Nenhuma análise para exportar.','warning');return;\n  }\n  if(!window.jspdf){toast('jsPDF não carregado.','error');return}\n\n  try{\n    const {jsPDF}=window.jspdf;\n    const doc=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});\n    const PW=210,PH=297,M=20,CW=170;\n    const HDR=46,FTR=14;\n    const CS=HDR+7; // content start Y\n    const CE=PH-FTR-5; // content end Y\n\n    // ─── COLOR PALETTE ───\n    const BG=[5,8,15],BG2=[12,21,38],GOLD=[196,162,74],GOLD2=[224,194,120];\n    const TXT=[200,214,235],MUT=[100,130,160],DIM=[45,60,85],BOR=[22,32,50];\n    const WHT=[255,255,255],GRN=[56,184,126];\n    // Texto sobre página branca (corpo do relatório): sempre escuro\n    const INK=[24,32,48],INK2=[70,85,105],GOLDD=[146,108,20],LINE=[200,206,216];\n\n    let curPage=1;\n\n    // ─── HEADER ───\n    function drawHdr(){\n      // Full background\n      doc.setFillColor(...BG);\n      doc.rect(0,0,PW,HDR,'F');\n\n      // Gold bottom stripe\n      doc.setFillColor(...GOLD);\n      doc.rect(0,HDR-1.2,PW,1.2,'F');\n\n      // Logo ring\n      const lx=M+5,ly=10;\n      doc.setDrawColor(...GOLD);doc.setLineWidth(.9);\n      doc.circle(lx,ly+5,5.5);\n      doc.setFillColor(...GOLD);doc.circle(lx,ly+5,1.8,'F');\n      doc.setLineWidth(.4);doc.circle(lx,ly+5,3.5);\n\n      // Brand name\n      doc.setTextColor(...WHT);doc.setFontSize(15);doc.setFont('helvetica','bold');\n      doc.text('AE360°',lx+9,ly+4);\n      doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.setTextColor(...MUT);\n      doc.text('Agente Estratégico 360°  ·  Relatório de Inteligência Analítica',lx+9,ly+10);\n\n      // Divider\n      doc.setDrawColor(...BOR);doc.setLineWidth(.25);\n      doc.line(M,ly+14.5,PW-M,ly+14.5);\n\n      // Contacts row\n      const org=S.get('pdfOrg'),email=S.get('pdfEmail'),phone=S.get('pdfPhone'),site=S.get('pdfSite');\n      const parts=[org,email,phone,site].filter(Boolean);\n      if(parts.length){\n        doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.setTextColor(...MUT);\n        doc.text(parts.join('   ·   '),M,ly+22,{maxWidth:CW*.72});\n      }else{\n        doc.setFontSize(7.5);doc.setTextColor(...DIM);\n        doc.text('Configure os dados do PDF nas definições da sidebar',M,ly+22);\n      }\n\n      // Date + Time (right)\n      const now=new Date();\n      const ds=now.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});\n      const ts=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});\n      doc.setFontSize(8.5);doc.setFont('helvetica','bold');doc.setTextColor(...GOLD);\n      doc.text(ds,PW-M,ly+3,{align:'right'});\n      doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.setTextColor(...MUT);\n      doc.text(ts,PW-M,ly+10,{align:'right'});\n\n      // Profile info (right, lower)\n      const perfil=document.getElementById('perfil').value;\n      const nivelEl=document.getElementById('nivel');\n      const nivelLabel=nivelEl.options[nivelEl.selectedIndex].text.replace(/^[①②③④]\\s/,'');\n      const radar=document.getElementById('radarGlobal').checked;\n      doc.setFontSize(7);doc.setTextColor(...DIM);\n      doc.text(`${perfil}  ·  ${nivelLabel}${radar?' · Radar Global':''}`,PW-M,ly+22,{align:'right'});\n    }\n\n    // ─── FOOTER ───\n    function drawFtr(pn,tot){\n      doc.setFillColor(...BG);\n      doc.rect(0,PH-FTR,PW,FTR,'F');\n      doc.setFillColor(...GOLD);\n      doc.rect(0,PH-FTR,PW,.9,'F');\n      doc.setFontSize(7);doc.setFont('helvetica','normal');doc.setTextColor(...DIM);\n      doc.text('Gerado por Agente Estratégico 360°  ·  Confidencial  ·  Uso Exclusivo Interno',M,PH-4.5);\n      doc.setFont('helvetica','bold');doc.setTextColor(...GOLD);\n      doc.text(`${pn} / ${tot}`,PW-M,PH-4.5,{align:'right'});\n    }\n\n    // ─── ENSURE SPACE ───\n    let y=CS;\n    function ensure(h){\n      if(y+h>CE){\n        doc.addPage();curPage++;\n        drawHdr();y=CS;\n      }\n    }\n\n    // ─── HTML → BLOCKS ───\n    function toBlocks(html){\n      const div=document.createElement('div');\n      div.innerHTML=DOMPurify.sanitize(html);\n      const out=[];\n      function walk(n){\n        if(n.nodeType===3){const t=n.textContent.trim();if(t)out.push({t:'tx',s:t});return}\n        if(n.nodeType!==1)return;\n        const tag=n.tagName.toLowerCase();\n        if(tag==='h2')out.push({t:'H1',s:n.textContent.trim()});\n        else if(tag==='h3'||tag==='h4')out.push({t:'H2',s:n.textContent.trim()});\n        else if(tag==='h5'||tag==='h6')out.push({t:'H3',s:n.textContent.trim()});\n        else if(tag==='p'){const t=n.textContent.trim();if(t)out.push({t:'P',s:t})}\n        else if(tag==='ul'||tag==='ol'){\n          const items=[];\n          (function collect(list,lv){\n            for(const li of Array.from(list.children)){\n              if(li.tagName.toLowerCase()!=='li')continue;\n              let txt='';const subs=[];\n              for(const c of li.childNodes){\n                if(c.nodeType===1&&/^(ul|ol)$/i.test(c.tagName))subs.push(c);else txt+=c.textContent;\n              }\n              txt=txt.trim();\n              if(txt)items.push({s:txt,lv,o:list.tagName.toLowerCase()==='ol'});\n              subs.forEach(sl=>collect(sl,lv+1));\n            }\n          })(n,0);\n          if(items.length)out.push({t:'LS',items});\n        }else if(tag==='table'){\n          const rows=Array.from(n.querySelectorAll('tr')).map(tr=>Array.from(tr.children).map(c=>c.textContent.trim()));\n          if(rows.length)out.push({t:'TB',head:rows[0],rows:rows.slice(1)});\n        }else if(tag==='pre'){\n          out.push({t:'CODE',s:n.textContent.replace(/\\n$/,'')});\n        }else if(tag==='blockquote'){const t=n.textContent.trim();if(t)out.push({t:'BQ',s:t})}\n        else if(tag==='hr')out.push({t:'HR'});\n        else if(tag==='br')out.push({t:'BR'});\n        else if(tag==='strong'||tag==='b'){const t=n.textContent.trim();if(t)out.push({t:'BD',s:t})}\n        else{for(const c of n.childNodes)walk(c)}\n      }\n      for(const c of div.childNodes)walk(c);\n      return out;\n    }\n\n    // ─── RENDER BLOCKS ───\n    function render(blocks){\n      for(const b of blocks){\n        switch(b.t){\n          case 'H1':{\n            ensure(16);if(y>CS+2)y+=4;\n            // Gold bar\n            doc.setFillColor(...GOLDD);doc.rect(M,y-5,3,11,'F');\n            doc.setFontSize(12);doc.setFont('helvetica','bold');doc.setTextColor(...GOLDD);\n            const ls=doc.splitTextToSize(b.s.toUpperCase(),CW-6);\n            ensure(ls.length*6+6);\n            doc.text(ls,M+6,y);y+=ls.length*6;\n            doc.setDrawColor(...LINE);doc.setLineWidth(.3);\n            doc.line(M,y+1.5,PW-M,y+1.5);y+=7;\n            break;\n          }\n          case 'H2':{\n            ensure(12);if(y>CS+2)y+=3;\n            doc.setFontSize(10.5);doc.setFont('helvetica','bold');doc.setTextColor(...INK);\n            const ls=doc.splitTextToSize(b.s,CW);ensure(ls.length*6);\n            doc.text(ls,M,y);y+=ls.length*6+3;\n            break;\n          }\n          case 'H3':{\n            ensure(10);if(y>CS)y+=2;\n            doc.setFontSize(9.5);doc.setFont('helvetica','bold');doc.setTextColor(...INK2);\n            const ls=doc.splitTextToSize(b.s.toUpperCase(),CW);\n            doc.text(ls,M,y);y+=ls.length*5.5+2;\n            break;\n          }\n          case 'P':{\n            doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(...INK);\n            const ls=doc.splitTextToSize(b.s,CW);\n            for(const l of ls){ensure(5.5);doc.text(l,M,y);y+=5}\n            y+=2;break;\n          }\n          case 'tx':{\n            doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(...INK);\n            const ls=doc.splitTextToSize(b.s,CW);\n            for(const l of ls){ensure(5.5);doc.text(l,M,y);y+=5}\n            y+=1;break;\n          }\n          case 'BD':{\n            doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(...INK);\n            const ls=doc.splitTextToSize(b.s,CW);\n            for(const l of ls){ensure(5.5);doc.text(l,M,y);y+=5}\n            y+=1;break;\n          }\n          case 'UL':{\n            for(const item of b.items){\n              const ls=doc.splitTextToSize(item,CW-7);\n              ensure(ls.length*4.8+1);\n              doc.setFillColor(...GOLDD);doc.circle(M+1.5,y-1.5,.9,'F');\n              doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(...INK);\n              doc.text(ls,M+5,y);y+=ls.length*4.8+1;\n            }\n            y+=2;break;\n          }\n          case 'OL':{\n            for(let i=0;i<b.items.length;i++){\n              const ls=doc.splitTextToSize(b.items[i],CW-9);\n              ensure(ls.length*4.8+1);\n              doc.setFontSize(8.5);doc.setFont('helvetica','bold');doc.setTextColor(...GOLDD);\n              doc.text(`${i+1}.`,M,y);\n              doc.setFont('helvetica','normal');doc.setTextColor(...INK);\n              doc.text(ls,M+7,y);y+=ls.length*4.8+1;\n            }\n            y+=2;break;\n          }\n          case 'BQ':{\n            const ls=doc.splitTextToSize(b.s,CW-8);\n            const bh=ls.length*5+8;ensure(bh+4);\n            doc.setFillColor(...GOLDD);doc.rect(M,y-3,2,bh,'F');\n            doc.setFillColor(246,241,226);doc.rect(M+3,y-3,CW-3,bh,'F');\n            doc.setFontSize(8.5);doc.setFont('helvetica','italic');doc.setTextColor(...INK2);\n            doc.text(ls,M+7,y);y+=bh+4;break;\n          }\n          case 'HR':{ensure(8);y+=3;doc.setDrawColor(...LINE);doc.setLineWidth(.4);doc.line(M,y,PW-M,y);y+=5;break}\n          case 'BR':{y+=3;break}\n          case 'LS':{\n            const cnt=[];\n            for(const it of b.items){\n              const ind=it.lv*5,lead=it.o?7:5;\n              cnt.length=it.lv+1;\n              if(it.o)cnt[it.lv]=(cnt[it.lv]||0)+1;\n              const ls=doc.splitTextToSize(it.s,CW-lead-ind);\n              ensure(ls.length*4.8+1);\n              if(it.o){doc.setFontSize(8.5);doc.setFont('helvetica','bold');doc.setTextColor(...GOLDD);doc.text(`${cnt[it.lv]}.`,M+ind,y)}\n              else{doc.setFillColor(...GOLDD);doc.circle(M+ind+1.5,y-1.5,it.lv?.6:.9,'F')}\n              doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(...INK);\n              doc.text(ls,M+ind+lead,y);y+=ls.length*4.8+1;\n            }\n            y+=2;break;\n          }\n          case 'CODE':{\n            doc.setFont('courier','normal');doc.setFontSize(8);doc.setTextColor(...INK);\n            const ls=b.s.split('\\n').flatMap(l=>doc.splitTextToSize(l||' ',CW-6));\n            for(const l of ls){ensure(4.4);doc.setFillColor(242,244,247);doc.rect(M,y-3.2,CW,4.2,'F');doc.text(l,M+3,y);y+=4}\n            y+=3;break;\n          }\n          case 'TB':{\n            const n=b.head.length;\n            const maxLen=b.head.map((h,k)=>Math.min(40,Math.max(6,String(h).length,...b.rows.map(r=>String(r[k]||'').length))));\n            const sum=maxLen.reduce((a,c)=>a+c,0);\n            const cws=maxLen.map(w=>CW*w/sum);\n            const drawRow=(cells,head)=>{\n              doc.setFontSize(8);doc.setFont('helvetica',head?'bold':'normal');\n              const lines=cws.map((w,k)=>doc.splitTextToSize(String(cells[k]||''),w-4));\n              const rh=Math.max(...lines.map(l=>l.length))*4.2+3.5;\n              ensure(rh+1);\n              let x=M;\n              if(head){doc.setFillColor(243,236,215);doc.rect(M,y-3.5,CW,rh,'F')}\n              doc.setDrawColor(...LINE);doc.setLineWidth(.2);\n              lines.forEach((l,k)=>{doc.rect(x,y-3.5,cws[k],rh,'S');doc.setTextColor(...INK);doc.text(l,x+2,y);x+=cws[k]});\n              y+=rh;\n            };\n            drawRow(b.head,true);b.rows.forEach(r=>drawRow(r,false));y+=3;break;\n          }\n        }\n      }\n    }\n\n    // ─── BUILD PDF ───\n    drawHdr();\n\n    // Meta info bar\n    const perfil=document.getElementById('perfil').value;\n    const nivelEl=document.getElementById('nivel');\n    const nivelLabel=nivelEl.options[nivelEl.selectedIndex].text.replace(/^[①②③④]\\s/,'');\n    const radar=document.getElementById('radarGlobal').checked;\n    const query=document.getElementById('userInput').value.trim();\n    const obj=document.getElementById('objetivos').value.trim();\n\n    // Meta card\n    doc.setFillColor(...BG2);doc.roundedRect(M,y,CW,18,2,2,'F');\n    doc.setDrawColor(...BOR);doc.setLineWidth(.25);doc.roundedRect(M,y,CW,18,2,2,'S');\n\n    const meta=[['PERFIL',perfil],['NÍVEL',nivelLabel],['RADAR',radar?'ATIVO':'INATIVO']];\n    let mx=M+5;\n    meta.forEach(([lbl,val])=>{\n      doc.setFontSize(7);doc.setFont('helvetica','bold');doc.setTextColor(...DIM);\n      doc.text(lbl,mx,y+7);\n      doc.setFontSize(8.5);doc.setFont('helvetica','bold');\n      if(lbl==='RADAR'&&val==='ATIVO')doc.setTextColor(...GRN);\n      else doc.setTextColor(...TXT);\n      doc.text(val,mx,y+14);\n      mx+=58;\n    });\n    y+=24;\n\n    // Query box\n    if(query){\n      doc.setFontSize(7.5);doc.setFont('helvetica','bold');doc.setTextColor(...GOLDD);\n      doc.text('CONSULTA',M,y);y+=5;\n      const ql=doc.splitTextToSize(query,CW-8);\n      const qh=ql.length*5+8;\n      doc.setFillColor(...BG2);doc.roundedRect(M,y,CW,qh,2,2,'F');\n      doc.setDrawColor(...BOR);doc.setLineWidth(.25);doc.roundedRect(M,y,CW,qh,2,2,'S');\n      doc.setFontSize(8.5);doc.setFont('helvetica','normal');doc.setTextColor(...TXT);\n      doc.text(ql,M+4,y+5);y+=qh+8;\n    }\n\n    // Objectives (abbreviated)\n    if(obj){\n      const ol=doc.splitTextToSize(obj,CW-8).slice(0,4);\n      const oh=ol.length*4.5+8;\n      doc.setFontSize(7.5);doc.setFont('helvetica','bold');doc.setTextColor(...INK2);\n      doc.text('OBJETIVOS',M,y);y+=4;\n      doc.setFillColor(...BG2);doc.roundedRect(M,y,CW,oh,2,2,'F');\n      doc.setFontSize(8);doc.setFont('helvetica','italic');doc.setTextColor(...MUT);\n      doc.text(ol,M+4,y+5);y+=oh+8;\n    }\n\n    // Divider\n    doc.setDrawColor(...BOR);doc.setLineWidth(.45);doc.line(M,y,PW-M,y);y+=8;\n\n    // Section heading\n    doc.setFontSize(9.5);doc.setFont('helvetica','bold');doc.setTextColor(...GOLDD);\n    doc.text('ANÁLISE ESTRATÉGICA',M,y);y+=9;\n\n    // Render response\n    const blocks=toBlocks(document.getElementById('response').innerHTML);\n    render(blocks);\n\n    // Add footers (all pages, now we know total)\n    const total=doc.internal.getNumberOfPages();\n    for(let p=1;p<=total;p++){doc.setPage(p);drawFtr(p,total)}\n\n    // Save\n    const now=new Date();\n    const fname=`AE360_${now.toISOString().slice(0,10)}_${now.getHours()}h${String(now.getMinutes()).padStart(2,'0')}.pdf`;\n    doc.save(fname);\n    toast('PDF exportado com sucesso!','success');\n\n  }catch(e){\n    console.error(e);\n    toast('Erro ao gerar PDF: '+e.message,'error',5000);\n  }\n}\n\n// ═══════════════════════════════════════════════\n//  PONTE COM O CHAT CONTÁBIL\n// ═══════════════════════════════════════════════\ndocument.getElementById('toChatBtn').onclick=()=>{\n  const rEl=document.getElementById('response');\n  if(!window.lastRaw||rEl.classList.contains('empty')){toast('Faça uma análise antes de continuar no Chat.','warning');return}\n  if(window.parent===window){toast('Disponível no app unificado (abas Chat + Agente).','info');return}\n  const perfil=document.getElementById('perfil').value;\n  const nivelEl=document.getElementById('nivel');\n  const nivel=nivelEl.options[nivelEl.selectedIndex].text.replace(/^[①②③④]\\s/,'');\n  const text=`Vou continuar no chat uma análise do Agente Estratégico 360° (perfil ${perfil}, nível ${nivel}). Use-a como contexto, confira o que for tributário/contábil e aprofunde.${(window.lastFiles&&window.lastFiles.length)?' Os arquivos analisados seguem anexados.':''}\\n\\nCONSULTA ORIGINAL:\\n${window.lastQuery||''}\\n\\nANÁLISE DO AGENTE:\\n${window.lastRaw}\\n\\nQuero aprofundar: `;\n  window.parent.postMessage({rc:'send-to-chat',text,attachments:window.lastFiles||[]},'*');\n};\n\n// Recebe consulta enviada pelo Chat\nwindow.rcReceive=function(d){\n  if(!d||!d.text)return;\n  const ta=document.getElementById('userInput');\n  ta.value=d.text;\n  document.getElementById('cc').textContent=ta.value.length+' chars';\n  if(d.perfil){const sel=document.getElementById('perfil');sel.value=d.perfil;S.set('perfil',d.perfil)}\n  if(Array.isArray(d.attachments)&&d.attachments.length){pendingFiles=d.attachments.slice();renderChips()}\n  ta.focus();\n  toast('Consulta recebida do Chat. Ajuste e clique em Analisar.','info',4500);\n};\n\n// Sincroniza chave/modelo quando o Chat os altera\nwindow.rcSync=function(){\n  const k=getKey();\n  if(k){document.getElementById('apiKey').value=k;S.set('apiKey',k);setApiStatus(true)}\n  else setApiStatus(false);\n};\n\n// ═══════════════════════════════════════════════\n//  START\n// ═══════════════════════════════════════════════\ndocument.addEventListener('DOMContentLoaded',()=>{init();AH.open().then(renderHistory)});\n<\/script>\n<\/body>\n<\/html>\n"</script>

<script>
(function(){
  var frames={chat:document.getElementById('f-chat'),agente:document.getElementById('f-agente')};
  var tabs=Array.prototype.slice.call(document.querySelectorAll('.tab'));
  frames.chat.srcdoc=JSON.parse(document.getElementById('src-chat').textContent);
  frames.agente.srcdoc=JSON.parse(document.getElementById('src-agente').textContent);

  function win(n){return frames[n].contentWindow}
  function call(n,fn,arg){try{var w=win(n);if(w&&typeof w[fn]==='function')return w[fn](arg)}catch(e){console.warn('[shell]',n,fn,e)}}

  // O Agente só é liberado depois que a chave (e o modelo) forem salvos no modal do Chat
  function ready(){try{return (localStorage.getItem('gemini_api_key')||localStorage.getItem('apiKey')||'').trim().length>10}catch(e){return false}}
  function refreshLock(){
    var locked=!ready();
    var t=tabs.filter(function(x){return x.dataset.tab==='agente'})[0];
    t.classList.toggle('locked',locked);
    t.title=locked?'Informe a chave da API e o modelo no Chat para liberar o Agente 360°':'';
    document.getElementById('hint').textContent=locked?'Informe a chave e o modelo no Chat para liberar o Agente 360°':'API key e modelo compartilhados';
    if(locked&&frames.agente.classList.contains('on'))show('chat',true);
  }

  function show(name,silent){
    if(name==='agente'&&!ready()){name='chat';silent=false}
    if(!frames[name])name='chat';
    Object.keys(frames).forEach(function(k){frames[k].classList.toggle('on',k===name)});
    tabs.forEach(function(t){t.classList.toggle('on',t.dataset.tab===name)});
    try{localStorage.setItem('rc_tab',name)}catch(e){}
    document.querySelector('meta[name="theme-color"]').setAttribute('content',name==='agente'?'#05080f':'#1f6feb');
    if(!silent)call(name,'rcSync');
  }
  tabs.forEach(function(t){t.addEventListener('click',function(){
    if(t.dataset.tab==='agente'&&!ready()){show('chat');call('chat','rcNeedKey');return}
    show(t.dataset.tab);
  })});

  // Ponte entre os apps (mensagens vindas dos iframes)
  window.addEventListener('message',function(e){
    var d=e.data;if(!d||typeof d!=='object'||!d.rc)return;
    var from=e.source===win('chat')?'chat':e.source===win('agente')?'agente':null;
    if(!from)return;
    if(d.rc==='send-to-agent'){show('agente');call('agente','rcReceive',d)}
    else if(d.rc==='send-to-chat'){show('chat');call('chat','rcReceive',d)}
  });

  // Mantém a chave sincronizada quando o outro app a altera
  window.addEventListener('storage',function(e){
    refreshLock();
    if(e.key==='gemini_api_key'||e.key==='apiKey'||e.key==='gemini_model_name'){
      var active=frames.chat.classList.contains('on')?'chat':'agente';
      call(active==='chat'?'agente':'chat','rcSync');
    }
  });

  var q=(location.search.match(/[?&]tab=(\w+)/)||[])[1];
  var saved='chat';try{saved=localStorage.getItem('rc_tab')||'chat'}catch(e){}
  show(q||saved,true);
  refreshLock();
  window.addEventListener('focus',refreshLock);

  window.rcShell={show:show,refresh:refreshLock};

  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('service-worker.js').catch(function(err){console.log('Erro no Service Worker',err)});
    });
  }
})();
</script>
</body>
</html>
