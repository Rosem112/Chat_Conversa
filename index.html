p: 6px;\n            font-size: 12px;\n            color: var(--text-secondary);\n            padding: 4px 10px;\n            background: var(--bg-secondary);\n            border-radius: var(--radius-full);\n        }\n\n        .status-dot {\n            width: 8px;\n            height: 8px;\n            background: var(--success);\n            border-radius: 50%;\n            animation: pulse 2s infinite;\n        }\n\n        .status-dot.offline {\n            background: var(--error);\n            animation: none;\n        }\n\n        .status-dot.thinking {\n            background: var(--warning);\n            animation: pulse 1s infinite;\n        }\n\n        @keyframes pulse {\n            0%, 100% { opacity: 1; }\n            50% { opacity: 0.5; }\n        }\n\n        .header-right {\n            display: flex;\n            align-items: center;\n            gap: 8px;\n        }\n\n        .icon-btn {\n            width: 36px;\n            height: 36px;\n            border: none;\n            background: transparent;\n            border-radius: var(--radius-full);\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            cursor: pointer;\n            color: var(--text-secondary);\n            transition: all 0.2s;\n            position: relative;\n        }\n\n        .icon-btn:hover {\n            background: var(--bg-tertiary);\n            color: var(--text-primary);\n        }\n\n        .icon-btn .tooltip {\n            position: absolute;\n            bottom: -30px;\n            left: 50%;\n            transform: translateX(-50%);\n            background: #333;\n            color: white;\n            padding: 4px 8px;\n            border-radius: 4px;\n            font-size: 11px;\n            white-space: nowrap;\n            opacity: 0;\n            pointer-events: none;\n            transition: opacity 0.2s;\n        }\n\n        .icon-btn:hover .tooltip {\n            opacity: 1;\n        }\n\n        .user-avatar {\n            width: 32px;\n            height: 32px;\n            border-radius: var(--radius-full);\n            background: var(--gradient-ai);\n            color: white;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            font-weight: 500;\n            font-size: 14px;\n            cursor: pointer;\n        }\n\n        /* Main Layout */\n        main {\n            flex: 1;\n            display: flex;\n            max-width: 1400px;\n            width: 100%;\n            margin: 0 auto;\n            min-height: 0;\n            overflow: hidden;\n        }\n\n        /* Sidebar */\n        .sidebar {\n            width: 280px;\n            padding: 16px;\n            border-right: 1px solid var(--border-color);\n            background: var(--bg-primary);\n            display: none;\n            flex-direction: column;\n            overflow-y: auto;\n            flex-shrink: 0;\n        }\n\n        @media (min-width: 900px) {\n            .sidebar { display: flex; }\n        }\n\n        .new-chat-btn {\n            display: flex;\n            align-items: center;\n            gap: 10px;\n            padding: 12px 16px;\n            background: var(--bg-secondary);\n            border: 1px solid var(--border-color);\n            border-radius: var(--radius-md);\n            cursor: pointer;\n            font-weight: 500;\n            color: var(--text-primary);\n            transition: all 0.2s;\n            margin-bottom: 16px;\n        }\n\n        .new-chat-btn:hover {\n            background: var(--bg-tertiary);\n            border-color: var(--google-blue);\n        }\n\n        .history-section {\n            flex: 1;\n            overflow-y: auto;\n        }\n\n        .history-label {\n            font-size: 11px;\n            font-weight: 500;\n            color: var(--text-tertiary);\n            text-transform: uppercase;\n            letter-spacing: 0.5px;\n            padding: 12px 8px 8px;\n        }\n\n        /* [NOVO] Histórico, anexos e menu móvel */\n        .history-item {\n            display: flex;\n            align-items: center;\n            gap: 6px;\n            padding: 9px 10px;\n            border-radius: var(--radius-sm);\n            cursor: pointer;\n            font-size: 13px;\n            color: var(--text-secondary);\n            transition: background 0.2s;\n        }\n        .history-item:hover { background: var(--bg-secondary); color: var(--text-primary); }\n        .history-item.active { background: var(--bg-tertiary); color: var(--text-primary); }\n        .history-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n        .history-del {\n            border: none; background: transparent; color: var(--text-tertiary);\n            font-size: 18px; line-height: 1; cursor: pointer; padding: 0 4px; border-radius: 4px;\n            opacity: 0; transition: opacity 0.2s;\n        }\n        .history-item:hover .history-del { opacity: 1; }\n        .history-del:hover { color: var(--google-red); }\n        .history-empty { font-size: 12px; color: var(--text-tertiary); padding: 8px; }\n        .history-clear {\n            margin-top: 8px; padding: 8px; background: transparent; border: 1px solid var(--border-color);\n            border-radius: var(--radius-sm); color: var(--text-tertiary); font-size: 12px; cursor: pointer;\n        }\n        .history-clear:hover { color: var(--google-red); border-color: var(--google-red); }\n        .menu-btn { display: flex; }\n        @media (min-width: 900px) { .menu-btn { display: none; } }\n        .sidebar.open {\n            display: flex; position: fixed; top: 60px; left: 0; bottom: 0; z-index: 60;\n            box-shadow: var(--shadow-lg); width: 290px;\n        }\n        .attach-chips { display: none; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }\n        .attach-chip {\n            display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 6px 4px 10px;\n            background: var(--bg-secondary); border: 1px solid var(--border-color);\n            border-radius: var(--radius-full); color: var(--text-secondary);\n        }\n        .attach-chip button {\n            border: none; background: transparent; color: var(--text-tertiary); cursor: pointer;\n            font-size: 16px; line-height: 1; padding: 0 4px;\n        }\n        .attach-chip button:hover { color: var(--google-red); }\n        .attach-btn { align-self: flex-end; flex-shrink: 0; }\n\n        /* Chat Area */\n        .chat-area {\n            flex: 1;\n            display: flex;\n            flex-direction: column;\n            min-width: 0;\n            height: 100%;\n        }\n\n        .chat-container {\n            flex: 1;\n            overflow-y: auto;\n            padding: 20px;\n            min-height: 0;\n        }\n\n        .chat-wrapper {\n            max-width: 900px;\n            margin: 0 auto;\n            width: 100%;\n        }\n\n        /* Welcome Screen */\n        .welcome-screen {\n            text-align: center;\n            padding: 40px 20px;\n            color: var(--text-secondary);\n        }\n\n        .welcome-screen h2 {\n            font-size: 28px;\n            font-weight: 500;\n            color: var(--text-primary);\n            margin-bottom: 16px;\n        }\n\n        .welcome-screen p {\n            font-size: 16px;\n            line-height: 1.6;\n            margin-bottom: 32px;\n        }\n\n        .welcome-suggestions {\n            display: grid;\n            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));\n            gap: 12px;\n            max-width: 800px;\n            margin: 0 auto;\n        }\n\n        .suggestion-card {\n            padding: 14px 16px;\n            background: var(--bg-secondary);\n            border: 1px solid var(--border-color);\n            border-radius: var(--radius-md);\n            text-align: left;\n            cursor: pointer;\n            font-size: 14px;\n            transition: all 0.2s;\n        }\n\n        .suggestion-card:hover {\n            border-color: var(--google-blue);\n            background: var(--bg-tertiary);\n            transform: translateY(-2px);\n        }\n\n        /* Messages - SEM LIMITAÇÃO DE ALTURA */\n        .message {\n            display: flex;\n            gap: 12px;\n            margin-bottom: 24px;\n            animation: slideIn 0.3s ease;\n        }\n\n        @keyframes slideIn {\n            from {\n                opacity: 0;\n                transform: translateY(10px);\n            }\n            to {\n                opacity: 1;\n                transform: translateY(0);\n            }\n        }\n\n        .message.user {\n            flex-direction: row-reverse;\n        }\n\n        .avatar {\n            width: 40px;\n            height: 40px;\n            border-radius: var(--radius-full);\n            flex-shrink: 0;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            font-size: 18px;\n            font-weight: 500;\n        }\n\n        .avatar.ai {\n            background: var(--gradient-ai);\n            color: white;\n        }\n\n        .avatar.user {\n            background: var(--user-bubble);\n            color: white;\n        }\n\n        .message-content {\n            max-width: 85%;\n            display: flex;\n            flex-direction: column;\n            gap: 6px;\n        }\n\n        .message.user .message-content {\n            align-items: flex-end;\n        }\n\n        /* Bubble - SEM ALTURA MÁXIMA, TODO CONTEÚDO VISÍVEL */\n        .bubble {\n            padding: 14px 20px;\n            border-radius: 20px;\n            font-size: 15px;\n            line-height: 1.6;\n            word-wrap: break-word;\n            overflow-wrap: break-word;\n            max-width: 100%;\n        }\n\n        .message.ai .bubble {\n            background: var(--ai-bubble);\n            color: var(--ai-text);\n            border-radius: 20px 20px 20px 4px;\n        }\n\n        .message.user .bubble {\n            background: var(--user-bubble);\n            color: var(--user-text);\n            border-radius: 20px 20px 4px 20px;\n        }\n\n        /* Estilos para conteúdo dentro do bubble */\n        .bubble p {\n            margin: 0 0 12px 0;\n        }\n\n        .bubble p:last-child {\n            margin-bottom: 0;\n        }\n\n        .bubble h1, .bubble h2, .bubble h3, .bubble h4 {\n            margin: 20px 0 12px 0;\n            font-weight: 600;\n        }\n\n        .bubble h1 { font-size: 1.8em; }\n        .bubble h2 { font-size: 1.5em; }\n        .bubble h3 { font-size: 1.3em; }\n        .bubble h4 { font-size: 1.1em; }\n\n        .bubble ul, .bubble ol {\n            margin: 12px 0;\n            padding-left: 24px;\n        }\n\n        .bubble li {\n            margin: 6px 0;\n        }\n\n        .bubble pre {\n            background: var(--code-bg);\n            border-radius: var(--radius-sm);\n            padding: 16px;\n            margin: 16px 0;\n            overflow-x: auto;\n            border: 1px solid var(--code-border);\n        }\n\n        .bubble pre code {\n            background: transparent;\n            padding: 0;\n            color: var(--code-text);\n            font-size: 13px;\n            font-family: 'Courier New', monospace;\n        }\n\n        .bubble code {\n            background: rgba(255, 255, 255, 0.1);\n            padding: 2px 6px;\n            border-radius: 4px;\n            font-family: 'Courier New', monospace;\n            font-size: 0.9em;\n        }\n\n        .bubble blockquote {\n            border-left: 3px solid var(--google-blue);\n            padding-left: 16px;\n            margin: 16px 0;\n            color: var(--text-secondary);\n        }\n\n        .bubble table {\n            border-collapse: collapse;\n            width: 100%;\n : scale(1); opacity: 1; }\n        }\n\n        /* Input Area */\n        .input-area {\n            padding: 16px 20px 24px;\n            background: linear-gradient(to top, var(--bg-primary) 85%, transparent);\n            flex-shrink: 0;\n        }\n\n        .input-wrapper {\n            max-width: 900px;\n            margin: 0 auto;\n        }\n\n        .input-container {\n            background: var(--bg-primary);\n            border: 1px solid var(--border-color);\n            border-radius: var(--radius-lg);\n            padding: 8px 12px;\n            display: flex;\n            align-items: flex-end;\n            gap: 8px;\n            box-shadow: var(--shadow-md);\n        }\n\n        .input-container:focus-within {\n            border-color: var(--google-blue);\n            box-shadow: 0 2px 12px rgba(66, 133, 244, 0.2);\n        }\n\n        textarea {\n            flex: 1;\n            border: none;\n            outline: none;\n            resize: none;\n            padding: 10px 4px;\n            font-family: inherit;\n            font-size: 15px;\n            line-height: 1.4;\n            min-height: 24px;\n            max-height: 150px;\n            background: transparent;\n            color: var(--text-primary);\n        }\n\n        textarea::placeholder {\n            color: var(--text-tertiary);\n        }\n\n        .send-btn {\n            width: 40px;\n            height: 40px;\n            border: none;\n            background: var(--google-blue);\n            color: white;\n            border-radius: var(--radius-full);\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            cursor: pointer;\n            transition: all 0.2s;\n            flex-shrink: 0;\n        }\n\n        .send-btn:hover:not(:disabled) {\n            background: #3367d6;\n            transform: scale(1.05);\n        }\n\n        .send-btn:disabled {\n            background: var(--bg-tertiary);\n            color: var(--text-tertiary);\n            cursor: not-allowed;\n        }\n\n        .input-footer {\n            display: flex;\n            justify-content: space-between;\n            align-items: center;\n            padding: 8px 4px 0;\n            font-size: 12px;\n            color: var(--text-tertiary);\n        }\n\n        .input-hint {\n            display: flex;\n            gap: 16px;\n            margin-top: 8px;\n            font-size: 12px;\n            color: var(--text-tertiary);\n        }\n\n        .input-hint kbd {\n            background: var(--bg-tertiary);\n            padding: 2px 6px;\n            border-radius: 4px;\n            font-family: inherit;\n            font-size: 11px;\n        }\n\n        /* Modal */\n        .modal-overlay {\n            position: fixed;\n            top: 0;\n            left: 0;\n            right: 0;\n            bottom: 0;\n            background: rgba(0, 0, 0, 0.85);\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            z-index: 1000;\n        }\n\n        .modal {\n            background: var(--bg-secondary);\n            border: 1px solid var(--border-color);\n            padding: 28px;\n            border-radius: var(--radius-lg);\n            max-width: 450px;\n            width: 90%;\n            box-shadow: var(--shadow-lg);\n        }\n\n        .modal h3 {\n            font-size: 20px;\n            margin-bottom: 16px;\n            color: var(--text-primary);\n        }\n\n        .modal p {\n            font-size: 14px;\n            color: var(--text-secondary);\n            margin-bottom: 20px;\n        }\n\n        .modal input {\n            width: 100%;\n            padding: 12px 14px;\n            border: 1px solid var(--border-color);\n            border-radius: var(--radius-md);\n            font-size: 14px;\n            background: var(--bg-primary);\n            color: var(--text-primary);\n        }\n\n        .modal input:focus {\n            outline: none;\n            border-color: var(--google-blue);\n        }\n\n        .modal label {\n            display: block;\n            margin-top: 16px;\n            margin-bottom: 8px;\n            font-size: 13px;\n            color: var(--text-secondary);\n        }\n\n        .modal label.tight {\n            margin-top: 12px;\n        }\n\n        .modal select {\n            width: 100%;\n            padding: 12px 14px;\n            border: 1px solid var(--border-color);\n            border-radius: var(--radius-md);\n            font-size: 14px;\n            background: var(--bg-primary);\n            color: var(--text-primary);\n        }\n\n        .modal p.modal-hint {\n            font-size: 11px;\n            color: var(--text-tertiary);\n            margin-top: 8px;\n        }\n\n        .modal-buttons {\n            display: flex;\n            gap: 12px;\n            justify-content: flex-end;\n            margin-top: 20px;\n        }\n\n        .modal-btn {\n            padding: 10px 20px;\n            border: none;\n            border-radius: var(--radius-md);\n            font-weight: 500;\n            cursor: pointer;\n            transition: all 0.2s;\n        }\n\n        .modal-btn.primary {\n            background: var(--google-blue);\n            color: white;\n        }\n\n        .modal-btn.secondary {\n            background: var(--bg-tertiary);\n            color: var(--text-primary);\n            border: 1px solid var(--border-color);\n        }\n\n        .modal-btn:hover {\n            transform: translateY(-1px);\n        }\n\n        .modal-note {\n            font-size: 12px;\n            color: var(--text-tertiary);\n            margin-top: 16px;\n            padding-top: 12px;\n            border-top: 1px solid var(--border-color);\n        }\n\n        .modal-note a {\n            color: var(--google-blue);\n            text-decoration: none;\n        }\n\n        .modal-success {\n            color: var(--success);\n            margin-top: 12px;\n            font-size: 14px;\n            display: flex;\n            align-items: center;\n            gap: 8px;\n        }\n\n        /* Export Buttons */\n        .export-buttons {\n            display: flex;\n            gap: 12px;\n            padding: 12px 20px;\n            background: var(--bg-secondary);\n            border-top: 1px solid var(--border-color);\n            justify-content: center;\n            flex-shrink: 0;\n        }\n\n        #exportButtons {\n            display: none;\n        }\n\n        #stopBtn {\n            display: none;\n        }\n\n        .subject-row {\n            margin-bottom: 12px;\n        }\n\n        .export-btn {\n            display: flex;\n            align-items: center;\n            gap: 8px;\n            padding: 8px 20px;\n            border: 1px solid var(--border-color);\n            border-radius: var(--radius-md);\n            background: var(--bg-primary);\n            color: var(--text-primary);\n            font-size: 13px;\n            font-weight: 500;\n            cursor: pointer;\n            transition: all 0.2s;\n        }\n\n        .export-btn:hover {\n            background: var(--bg-tertiary);\n            border-color: var(--google-blue);\n            color: var(--google-blue);\n        }\n\n        /* Toast */\n        .toast {\n            position: fixed;\n            bottom: 100px;\n            left: 50%;\n            transform: translateX(-50%);\n            background: var(--bg-secondary);\n            color: var(--text-primary);\n            border: 1px solid var(--border-color);\n            padding: 12px 24px;\n            border-radius: 999px;\n            font-size: 14px;\n            z-index: 2000;\n            box-shadow: var(--shadow-lg);\n            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;\n        }\n\n        @keyframes toastIn {\n            from { opacity: 0; transform: translateX(-50%) translateY(20px); }\n            to { opacity: 1; transform: translateX(-50%) translateY(0); }\n        }\n\n        @keyframes toastOut {\n            from { opacity: 1; transform: translateX(-50%) translateY(0); }\n            to { opacity: 0; transform: translateX(-50%) translateY(-20px); }\n        }\n\n        .hidden {\n            display: none !important;\n        }\n\n        /* Print Styles - HTML PURO */\n        @media print {\n            /* Desmonta o layout de app (flex + 100vh + overflow) para que o\n               conteúdo do chat flua normalmente entre as páginas. Sem isso,\n               mensagens longas são cortadas no PDF. */\n            html, body {\n                display: block !important;\n                height: auto !important;\n                max-height: none !important;\n                overflow: visible !important;\n            }\n\n            body {\n                background: white !important;\n                color: black !important;\n            }\n\n            main, .chat-area, .chat-container, .chat-wrapper {\n                display: block !important;\n                flex: none !important;\n                height: auto !important;\n                max-height: none !important;\n                min-height: 0 !important;\n                overflow: visible !important;\n            }\n\n            .chat-container {\n                padding: 20px !important;\n            }\n\n            .chat-wrapper {\n                max-width: none !important;\n            }\n\n            header, .sidebar, .input-area, .export-buttons, .icon-btn,\n            .status-indicator, .toast, .modal-overlay, .message-actions,\n            .new-chat-btn, .welcome-screen {\n                display: none !important;\n            }\n\n            .message {\n                break-inside: auto;\n                page-break-inside: auto;\n                margin-bottom: 20px;\n            }\n\n            .bubble {\n                break-inside: auto;\n                page-break-inside: auto;\n                background: #f5f5f5 !important;\n                color: black !important;\n                border: 1px solid #ddd !important;\n            }\n\n            .message.user .bubble {\n                background: #e3f2fd !important;\n            }\n\n            .avatar {\n                border: 1px solid #ccc !important;\n            }\n\n            pre {\n                background: #f8f8f8 !important;\n                border: 1px solid #ddd !important;\n            }\n\n            .print-header {\n                display: block !important;\n                text-align: center;\n                padding: 20px;\n                border-bottom: 2px solid #1f6feb;\n                margin-bottom: 20px;\n            }\n        }\n\n        .print-header {\n            display: none;\n        }\n\n        #subjectInput {\n            width: 100%;\n            border: 1px solid var(--border-color);\n            border-radius: var(--radius-lg);\n            padding: 12px 14px;\n            font-size: 14px;\n            outline: none;\n            color: var(--text-primary);\n            background: var(--bg-primary);\n        }\n\n        #subjectInput:focus {\n            border-color: var(--google-blue);\n        }\n        \n        /* FOOTER CENTRALIZADO */\n\n        .app-footer{\n        width:100%;\n        padding:12px 20px;\n        background: var(--bg-secondary);\n        border-top:1px solid var(--border-color);\n\n        display:flex;\n        justify-content:center;   /* centraliza horizontal */\n        align-items:center;       /* centraliza vertical */\n        text-align:center;\n\n        font-size:13px;\n        color:var(--text-secondary);\n        }\n\n        .footer-content{\n        display:flex;\n        justify-content:center;\n        align-items:center;\n        text-align:center;\n\n        gap:10px;\n        flex-wrap:wrap;\n        }\n\n        .footer-divider{\n        opacity:0.4;\n        }\n        \n    <\/style>\n<\/head>\n<body>\n\n    <div class=\"print-header\" id=\"printHeader\">\n        <h1>💬 Chat AI - Responde<\/h1>\n        <p id=\"printDate\"><\/p>\n    <\/div>\n\n    <div class=\"modal-overlay\" id=\"apiKeyModal\">\n        <div class=\"modal\">\n            <h3>🔑 Configurar API Key<\/h3>\n            <p>Insira sua chave da API Google Gemini para começar.<\/p>\n            <input type=\"password\" id=\"apiKeyInput\" placeholder=\"Cole sua API key aqui (começa com AIza...)\" autocomplete=\"off\">\n            <label for=\"modelSelect\">Modelo Gemini<\/label>\n            <select id=\"modelSelect\" aria-label=\"Selecionar modelo Gemini\">\n                <option value=\"gemini-4-argon\">Gemini 4 Argon — mais avançado<\/option>\n                <option value=\"gemini-3.8-flash\" selected>Gemini 3.8 Flash — recomendado<\/option>\n                <option value=\"gemini-3.6-flash\">Gemini 3.6 Flash — equilíbrio<\/option>\n                <option value=\"gemini-3.5-flash-lite\">Gemini 3.5 Flash-Lite — rápido/econômico<\/option>\n                <option value=\"gemini-3.1-flash-lite\">Gemini 3.1 Flash-Lite — econômico<\/option>\n                <option value=\"gemini-3.1-pro-preview\">Gemini 3.1 Pro — preview<\/option>\n                <option value=\"gemini-3-flash-preview\">Gemini 3 Flash — preview<\/option>\n            <\/select>\n            <label for=\"customModelInput\" class=\"tight\">Ou digite outro modelo<\/label>\n            <input type=\"text\" id=\"customModelInput\" placeholder=\"Ex.: gemini-3.8-flash\" autocomplete=\"off\" spellcheck=\"false\">\n            <p class=\"modal-hint\">Use o identificador exato aceito pela sua API key. Modelos de imagem, voz e TTS não funcionam neste chat de texto.<\/p>\n            <div class=\"modal-buttons\">\n                <button class=\"modal-btn secondary\" id=\"cancelApiKey\">Cancelar<\/button>\n                <button class=\"modal-btn primary\" id=\"saveApiKey\">Salvar<\/button>\n            <\/div>\n            <div id=\"saveSuccess\" class=\"modal-success hidden\">\n                ✅ API Key salva com sucesso!\n            <\/div>\n            <p class=\"modal-note\">\n                🔐 Sua chave é armazenada apenas no seu navegador.<br>\n                <a href=\"https://aistudio.google.com/app/apikey\" target=\"_blank\" rel=\"noopener\">Obter uma API key →<\/a>\n            <\/p>\n        <\/div>\n    <\/div>\n\n    <header>\n        <div class=\"header-left\">\n            <button class=\"icon-btn menu-btn\" id=\"menuBtn\" title=\"Histórico\" type=\"button\">\n                <i class=\"material-icons-outlined\">menu<\/i>\n            <\/button>\n            <div class=\"logo\">\n            \n            <div class=\"logo-icon\">✨<\/div>\n                <span>CHAT AI<\/span>\n            <\/div>\n            <div class=\"status-indicator\">\n                <span class=\"status-dot\" id=\"statusDot\"><\/span>\n                <span id=\"statusText\">Online<\/span>\n            <\/div>\n        <\/div>\n        <div class=\"header-right\">\n            <button class=\"icon-btn\" id=\"newChatBtn\" title=\"Novo chat\">\n                <i class=\"material-icons-outlined\">add<\/i>\n                <span class=\"tooltip\">Novo chat<\/span>\n            <\/button>\n            <button class=\"icon-btn\" id=\"exportPdfBtn\" title=\"Exportar PDF\">\n                <i class=\"material-icons-outlined\">picture_as_pdf<\/i>\n                <span class=\"tooltip\">Exportar PDF<\/span>\n            <\/button>\n            <button class=\"icon-btn\" id=\"exportHtmlBtn\" title=\"Exportar HTML\">\n                <i class=\"material-icons-outlined\">code<\/i>\n                <span class=\"tooltip\">Exportar HTML<\/span>\n            <\/button>\n            <button class=\"icon-btn\" id=\"resetKeyBtn\" title=\"Redefinir API Key\">\n                <i class=\"material-icons-outlined\">key<\/i>\n                <span class=\"tooltip\">Redefinir chave<\/span>\n            <\/button>\n            <div class=\"user-avatar\">U<\/div>\n        <\/div>\n    <\/header>\n\n    <main>\n        <aside class=\"sidebar\" id=\"sidebar\">\n            <button class=\"new-chat-btn\" id=\"sidebarNewChat\" type=\"button\">\n                <i class=\"material-icons-outlined\">add<\/i> Novo chat\n            <\/button>\n            <div class=\"history-section\">\n                <div class=\"history-label\">Histórico (salvo neste navegador)<\/div>\n                <div id=\"historyList\"><\/div>\n            <\/div>\n            <button class=\"history-clear\" id=\"clearHistoryBtn\" type=\"button\">Limpar todo o histórico<\/button>\n        <\/aside>\n\n        <div class=\"chat-area\">\n            <div class=\"chat-container\" id=\"chatContainer\">\n                <div class=\"chat-wrapper\">\n                    <div class=\"welcome-screen\" id=\"welcomeScreen\">\n                        <h2>Olá! Como posso ajudar?<\/h2>\n                        <p>Digite sua pergunta abaixo ou use os cards de sugestão.<\/p>\n                        <div class=\"welcome-suggestions\" id=\"suggestionsContainer\">\n                            <div class=\"suggestion-card\" data-prompt=\"Elabore o lançamento contábil de: [ASSUNTO].\n\nInforme: data e fato contábil; contas debitadas e creditadas; valores (campos a preencher se faltarem dados); histórico sugerido; fundamento (CPC/NBC) e critério de reconhecimento; reflexos em ativo, passivo, PL, resultado e caixa; tratamento tributário em separado; documentos de suporte e conciliação necessária.\">\n                                1 - Lançamento contábil\n                            <\/div>\n\n                            <div class=\"suggestion-card\" data-prompt=\"Faça o comparativo de regimes (Simples Nacional, Lucro Presumido e Lucro Real) para: [ASSUNTO].\n\nCalcule o Fator R se for serviço; mostre em tabela a economia LÍQUIDA (INSS e IRRF dos sócios, CPP, ISS, retenções e custo de conformidade); declare as premissas; aponte riscos (LC 224/2025, Lei 15.270/2025) e o impacto da reforma em 2027 em diante (Simples puro x híbrido). Liste os dados que faltam para fechar a conclusão.\">\n                                2 - Comparativo de regimes\n                            <\/div>\n\n                            <div class=\"suggestion-card\" data-prompt=\"Revise tecnicamente o cálculo, lançamento ou documento a seguir: [ASSUNTO].\n\nSepare erros confirmados, inconsistências prováveis, pontos a investigar e melhorias. Refaça a conta mostrando as etapas e entregue a versão corrigida, indicando como validar.\">\n                                3 - Revisão de cálculo ou documento\n                            <\/div>\n\n                            <div class=\"suggestion-card\" data-prompt=\"Redija a resposta ao cliente sobre: [ASSUNTO].\n\nEntregue (1) versão WhatsApp de até 6 linhas e (2) versão curta para e-mail. Linguagem simples, sem jargão, com a ação recomendada e uma ressalva de validação. Não prometa economia nem resultado.\">\n                                4 - Resposta ao cliente (WhatsApp / e-mail)\n                            <\/div>\n\n                            <div class=\"suggestion-card\" data-prompt=\"Analise o impacto da Reforma Tributária do consumo (IBS, CBS e Imposto Seletivo) para: [ASSUNTO].\n\nConfirme na fonte oficial a regra vigente hoje e a transição; separe regra aprovada, regulamentação, hipótese e estimativa; mostre efeitos em preço, margem, créditos, documentos fiscais e caixa; termine com ações práticas e prazos.\">\n                                5 - Reforma tributária (IBS/CBS)\n                            <\/div>\n\n                            <div class=\"suggestion-card\" data-prompt=\"Monte o checklist de fechamento e das obrigações do mês para: [ASSUNTO] (informe regime, atividade e UF).\n\nConfirme os prazos vigentes na fonte oficial; inclua DAS, DCTFWeb, eSocial, EFD, ECD/ECF conforme aplicável, conciliações e conferências, e os riscos de multa de cada item.\">\n                                6 - Fechamento e obrigações do mês\n                            <\/div>\n\n                        <\/div>\n                    <\/div>\n                    <div id=\"messagesArea\"><\/div>\n                <\/div>\n            <\/div>\n\n            <div class=\"export-buttons\" id=\"exportButtons\">\n                <button class=\"export-btn\" id=\"exportPdfAction\">\n                    <i class=\"material-icons-outlined\">picture_as_pdf<\/i>\n                    Exportar PDF\n                <\/button>\n                <button class=\"export-btn\" id=\"exportHtmlAction\">\n                    <i class=\"material-icons-outlined\">code<\/i>\n                    Exportar HTML\n                <\/button>\n                <button class=\"export-btn\" id=\"sendToAgentBtn\" title=\"Leva a última pergunta e resposta para o Agente Estratégico 360°\">\n                    <i class=\"material-icons-outlined\">insights<\/i>\n                    Aprofundar no Agente 360°\n                <\/button>\n                <button class=\"export-btn\" id=\"exportMarkdownAction\">\n                    <i class=\"material-icons-outlined\">description<\/i>\n                    Exportar Markdown\n                <\/button>\n            <\/div>\n\n            <div class=\"input-area\">\n                <div class=\"input-wrapper\">\n                    <div class=\"subject-row\">\n                        <input id=\"subjectInput\" type=\"text\" placeholder=\"✨ Descreva o caso (atividade, regime, faturamento, folha...) e clique em um card acima\">\n                    <\/div>\n                    <div class=\"attach-chips\" id=\"attachChips\"><\/div>\n                    <input type=\"file\" id=\"fileInput\" multiple hidden\n                           accept=\".xml,.pdf,.xlsx,.xls,.xlsm,.ods,.csv,.tsv,.txt,.json,.md,.ofx,.html,.htm,.png,.jpg,.jpeg,.webp\">\n                    <div class=\"input-container\">\n                        <button class=\"icon-btn attach-btn\" id=\"attachBtn\" type=\"button\" title=\"Anexar XML, PDF, planilha ou imagem\">\n                            <i class=\"material-icons-outlined\">attach_file<\/i>\n                        <\/button>\n                        <textarea id=\"userInput\" placeholder=\"✨ Digite sua mensagem...\" rows=\"1\" maxlength=\"30000\"><\/textarea>\n                        <button class=\"send-btn\" id=\"sendBtn\" disabled>\n                            <i class=\"material-icons-outlined\">send<\/i>\n                        <\/button>\n                    <\/div>\n                    <div class=\"input-footer\">\n                        <span><span id=\"charCount\">0<\/span>/30000<\/span>\n                        <button class=\"icon-btn\" id=\"askAgentBtn\" type=\"button\" title=\"Analisar no Agente Estratégico 360°\">\n                            <i class=\"material-icons-outlined\">insights<\/i>\n                        <\/button>\n                        <button class=\"icon-btn\" id=\"stopBtn\">\n                            <i class=\"material-icons-outlined\">stop<\/i>\n                        <\/button>\n                    <\/div>\n                    <div class=\"input-hint\">\n                        <span><kbd>Enter<\/kbd> enviar<\/span>\n                        <span><kbd>Shift+Enter<\/kbd> nova linha<\/span>\n                    <\/div>\n                <\/div>\n            <\/div>\n        <\/div>\n    <\/main>\n\n  <\u0021-- Footer -->\n    <footer class=\"app-footer\">\n    <div class=\"footer-content\">\n        <span id=\"footerGreeting\"><\/span>\n        <span class=\"footer-divider\">|<\/span>\n        <span id=\"footerDate\"><\/span>\n        <span class=\"footer-divider\">|<\/span>\n        <span id=\"footerClock\"><\/span>\n    <\/div>\n    <\/footer>\n\n    <script>\n        // ===== CONFIGURAÇÃO =====\n        const CONFIG = {\n            MODEL_NAME: \"gemini-3.8-flash\",\n            API_BASE: \"https://generativelanguage.googleapis.com/v1beta/models\",\n            TIMEOUT_MS: 180000,\n            MAX_OUTPUT_TOKENS: 32768,          // inclui tokens de raciocínio; se a API recusar, cai para o valor abaixo\n            MAX_OUTPUT_TOKENS_FALLBACK: 8192,\n            MAX_HISTORY: 20,                   // mensagens enviadas em cada chamada\n            USAR_BUSCA_WEB: true,              // Grounding com Google Search (normalmente exige chave com faturamento ativo)\n            THINKING_LEVEL: \"high\",            // \"low\" | \"medium\" | \"high\" | \"\" (padrão do modelo)\n            EXIBIR_SUGESTOES_GOOGLE: false,    // true = mostra o bloco \"Search Suggestions\" exigido pelos termos do Google\n            ALERTAR_CPF: true,                 // avisa e oferece mascarar CPF antes de enviar à IA (LGPD / sigilo)\n        };\n\n        const SYSTEM_INSTRUCTION = String.raw`\nIDENTIDADE, PAPEL E MISSÃO\nVocê é o assistente técnico interno do escritório RCONT-SCT (Soluções Contábeis e Tributárias), usado pelo contador responsável (CRC) e pela equipe do escritório. Atue como contador sênior, tributarista, consultor de controladoria e revisor técnico no contexto brasileiro: CONTABILIDADE, CONTROLADORIA, TRIBUTAÇÃO, FISCAL, FOLHA/DEPARTAMENTO PESSOAL, SOCIETÁRIO, FINANÇAS, AUDITORIA, CUSTOS e COMPLIANCE.\n\nPor padrão, trate o interlocutor como colega profissional experiente: comece pela conclusão, use a terminologia técnica sem definir o básico, cite a base legal e destaque apenas o que muda a decisão. Didatize (iniciante, passo a passo, aula) somente quando o usuário pedir ou o pedido indicar. Quando o texto for destinado ao cliente final (WhatsApp, e-mail, proposta), mude para linguagem simples e entregue o texto pronto para copiar.\n\nVocê apoia, mas não substitui o julgamento nem a responsabilidade técnica do contador habilitado: não assine documentos, não declare ter transmitido obrigações, consultado sistemas (e-CAC, ERP, prefeituras, SEFAZ) ou conferido documentos que não foram fornecidos no chat.\n\nOBJETIVO CENTRAL\nEntregar respostas que ajudem a compreender, calcular, contabilizar, conferir, decidir, documentar e executar tarefas profissionais com segurança. Não seja apenas um explicador: quando solicitado, atue como tutor, revisor técnico, analista de cenários, orientador de procedimentos, apoio à tomada de decisão e revisor de qualidade. Priorize respostas específicas, aplicáveis e verificáveis; evite generalidades, conclusões precipitadas e excesso de jargão.\n\nESCOPO CONTÁBIL ABRANGENTE\nAtenda, conforme a pertinência, às seguintes áreas:\n1. Contabilidade geral, societária e escrituração: partidas dobradas, plano de contas, lançamentos, razonetes, balancete, diário, razão, conciliações, provisões, competência versus caixa, reconhecimento e mensuração, ativo, passivo, patrimônio líquido, receitas, custos, despesas, resultado, encerramento, demonstrações contábeis e notas explicativas.\n2. Normas contábeis: legislação societária brasileira, Lei 6.404/1976 e alterações, pronunciamentos CPC, NBC, normas do CFC, convergência às IFRS e normas aplicáveis por porte, tipo de entidade e período. Confirme a norma específica e sua vigência antes de afirmar que é obrigatória; não invente números de pronunciamentos ou itens.\n3. Demonstrações e análise: BP, DRE, DRA, DFC, DMPL, DLPA quando aplicável, notas explicativas, indicadores de liquidez, endividamento, rentabilidade, margem, giro, capital de giro, análise vertical/horizontal, EBITDA e limitações de indicadores.\n4. Tributos e planejamento tributário lícito: Simples Nacional, MEI, Lucro Presumido, Lucro Real, IRPJ, CSLL, PIS/Pasep, Cofins, IPI, ICMS, ISS, IOF, ITR, ITCMD, ITBI, IPVA, IPTU, contribuições previdenciárias, retenções, obrigações principais e acessórias, regimes especiais, incentivos, benefícios, compensações, restituições, fiscalização e contencioso administrativo tributário. Inclua: distribuição de lucros e dividendos após a Lei 15.270/2025 (retenção de IRRF, IRPFM e regra de transição), Lucro Presumido após a LC 224/2025 (acréscimo de presunção acima de R$ 5 milhões/ano), pró-labore, INSS de sócios e Fator R.\n5. Reforma Tributária do consumo: EC 132/2023, LC 214/2025, LC 227/2026, regulamentos da CBS e do IBS, IBS, CBS, Imposto Seletivo, transição 2026-2033, créditos, não cumulatividade, regimes diferenciados/específicos, Simples Nacional (recolhimento unificado versus regime regular de IBS/CBS, o chamado Simples híbrido), documentos fiscais, split payment, impactos em preços, margens, contratos, fornecedores, clientes, capital de giro, ERP e fluxo de caixa. Sempre separar regra aprovada, regulamentação vigente, transição, hipótese e estimativa.\n6. Escrituração e obrigações digitais: SPED Contábil (ECD), ECF, EFD ICMS/IPI, EFD-Contribuições, EFD-Reinf, eSocial, DCTFWeb, MIT e declarações/obrigações que forem aplicáveis ao período e contribuinte; NF-e, NFC-e, NFS-e, CT-e, MDF-e, eventos, leiautes, validações e cruzamentos. Verifique nome, obrigatoriedade, prazo e versão do leiaute em fonte oficial quando a atualização for essencial.\n7. Rotinas fiscais: NCM, NBS, CFOP, CST, CSOSN, cClassTrib, CEST, classificação de operações, base de cálculo, alíquotas, diferencial de alíquotas, substituição tributária, antecipação, monofasia, retenções, devoluções, cancelamentos, bonificações, transferências, importação, exportação, operações interestaduais, marketplace e comércio eletrônico. Não determine classificação fiscal definitiva sem descrição técnica suficiente do produto/operação.\n8. Contabilidade de custos e gerencial: custos diretos/indiretos, fixos/variáveis, absorção, variável, ABC, custo-padrão, margem de contribuição, ponto de equilíbrio, preço de venda, mark-up, orçamento, forecast, centros de custos, rateios, análise de rentabilidade por produto/cliente/canal e decisões make-or-buy.\n9. Auditoria, revisão e controles internos: planejamento, materialidade, riscos, evidências, amostragem, testes, circularização, inventário, conciliações, trilha de auditoria, segregação de funções, fraude, erros, controles preventivos/detectivos e achados. Diferencie auditoria independente, auditoria interna, revisão limitada e procedimentos previamente acordados.\n10. Departamento pessoal e previdenciário: admissão, folha, salários, férias, 13º, rescisões, encargos, FGTS, INSS, IRRF, benefícios, convenções coletivas, eSocial, afastamentos e obrigações relacionadas. Regras trabalhistas exigem data, categoria, convenção coletiva e circunstâncias; sinalize necessidade de validação jurídica quando houver controvérsia.\n11. Societário e empresarial: constituição, alterações, tipos societários, capital social, distribuição de lucros, pró-labore, atas, dissolução, reorganizações, fusões, cisões, incorporações, operações entre partes relacionadas, beneficiário final e registros pertinentes. Delimite quando a questão exige orientação jurídica ou registral.\n12. Contabilidade por segmento: comércio, indústria, serviços, construção civil, imobiliário, agronegócio, tecnologia, saúde, profissionais liberais, entidades sem fins lucrativos, condomínios, cooperativas e setor público, respeitando normas específicas quando aplicáveis.\n13. Contabilidade pública e terceiro setor: orçamento público, receitas e despesas públicas, empenho, liquidação, pagamento, MCASP, PCASP, SIAFIC, prestação de contas e normas específicas; entidades sem fins lucrativos, restrições de recursos, prestação de contas e tratamento contábil próprio.\n14. Finanças e controladoria: fluxo de caixa, capital de giro, orçamento, endividamento, custo de capital, avaliação de investimentos, cenários, análise de sensibilidade, indicadores, governança, planejamento financeiro e riscos. Não confunda análise contábil com aconselhamento de investimento individual.\n15. Tecnologia e dados: ERP, integração contábil-fiscal, Excel, planilhas, Power Query, SQL, Python, automação, importação de arquivos, validação de dados, conciliações automatizadas, dashboards e documentação de processos. Ao produzir código, explique premissas, entradas, saídas, validações e riscos; não afirme que executou código ou acessou sistemas sem fazê-lo.\n16. Ética e responsabilidade profissional: sigilo, proteção de dados, independência, conflito de interesses, documentação, rastreabilidade, qualidade, limites de atuação e normas éticas aplicáveis.\n\nDATA-BASE, LEGISLAÇÃO E FONTES\n1. Use a data atual fornecida pelo contexto do aplicativo como data-base. Em questões históricas, identifique o período analisado.\n2. Diferencie claramente: norma publicada, norma vigente, norma com efeitos futuros, norma revogada/alterada, projeto de lei, regulamentação pendente, orientação administrativa, jurisprudência, interpretação técnica, hipótese, estimativa e recomendação.\n3. Para matéria brasileira, priorize fontes oficiais e primárias: Planalto e Diário Oficial; Receita Federal; PGFN; CFC e CPC; CONFAZ; Comitê Gestor do IBS; secretarias estaduais e municipais; eSocial, SPED e portais oficiais; CVM, Banco Central, tribunais e demais órgãos competentes conforme o tema.\n4. Use fontes secundárias reconhecidas para explicar ou comparar, sem tratá-las como substitutas da norma. Ao citar, informe órgão/autor, norma ou documento, dispositivo relevante, data/versão e link quando realmente disponível.\n5. Pesquisa na web: o CONTEXTO AUTOMÁTICO DA SESSÃO informa se a busca na web está ATIVA ou INATIVA nesta chamada. Se ATIVA, use-a sempre que a resposta depender de norma, prazo, alíquota, tabela, leiaute, resolução, portaria, solução de consulta ou orientação que possa ter mudado desde o seu treinamento (especialmente reforma tributária, Simples Nacional, Lei 15.270/2025, LC 224/2025, eSocial, SPED e NF-e/NFS-e), priorizando fontes oficiais e informando a data/identificação da norma. Se INATIVA, avise que não consultou fontes atuais e indique qual fonte oficial deve ser conferida. Nunca afirme ter pesquisado, aberto ou confirmado algo que não foi efetivamente consultado.\n6. Nunca invente leis, artigos, itens CPC/NBC, súmulas, decisões, soluções de consulta, alíquotas, prazos, códigos, links, obrigações ou resultados de consulta.\n7. Não presuma que uma regra de um estado, município, setor ou regime vale para todos. Identifique jurisdição, atividade, operação e período.\n8. Se fontes ou regras parecerem conflitantes, exponha a divergência, a hierarquia normativa, o período e o que precisa ser confirmado; não esconda a incerteza.\n\nMÉTODO PROFISSIONAL DE ANÁLISE\n1. Identifique a pergunta central e o produto esperado: explicação, lançamento, cálculo, conciliação, parecer técnico, procedimento, comparação, revisão ou plano de ação.\n2. Determine entidade, regime, atividade, jurisdição, período de apuração, data do fato, operação e norma aplicável.\n3. Separe fatos informados, documentos disponíveis, premissas, dados faltantes e hipóteses.\n4. Faça somente as perguntas indispensáveis. Se for possível avançar, declare premissas de modo explícito e entregue uma análise preliminar.\n5. Apresente a regra ou princípio aplicável e explique como ele se conecta aos fatos; não se limite a despejar artigos ou definições.\n6. Quando apropriado, mostre o tratamento contábil, fiscal, financeiro, documental e operacional, destacando diferenças entre eles.\n7. Faça cálculos reproduzíveis, confira os resultados e indique os dados que poderiam alterar a conclusão.\n8. Avalie exceções, materialidade, riscos, impactos, alternativas lícitas e controles de prevenção.\n9. Conclua de forma direta e apresente próximos passos, documentos necessários, responsáveis sugeridos e pontos de validação.\n10. Faça uma revisão final: consistência técnica, aritmética, vigência, terminologia, completude e aderência à pergunta.\n\nLANÇAMENTOS CONTÁBEIS\nQuando solicitado a elaborar lançamento, apresente, conforme os dados disponíveis:\n- data e fato contábil;\n- contas debitadas e creditadas;\n- valores e histórico sugerido;\n- fundamento contábil e critério de reconhecimento/mensuração;\n- reflexos no ativo, passivo, patrimônio líquido, resultado e fluxo de caixa;\n- tratamento tributário separado, se pertinente;\n- documentos de suporte e conciliação necessária.\nNão apresente um lançamento como universal quando depender do plano de contas, política contábil, regime tributário, contrato, natureza da operação ou norma específica. Se faltarem valores, demonstre a estrutura e marque os campos a preencher.\n\nCÁLCULOS, PLANILHAS E SIMULAÇÕES\n1. Explicite dados de entrada, período, unidade, fórmula, alíquota, base, deduções, limites, créditos, arredondamentos e fonte dos parâmetros.\n2. Mostre etapas suficientes para o profissional reproduzir e conferir o resultado.\n3. Não invente dados ausentes. Não confunda exemplo didático, estimativa, provisão, valor contabilizado, valor declarado e valor efetivamente recolhido.\n4. Todo exemplo hipotético deve começar por: \"SIMULAÇÃO DIDÁTICA — validar os dados e a regra vigente antes de usar em apuração, lançamento, emissão, declaração ou pagamento\".\n5. Em comparações de regimes, considere, conforme aplicável, tributos, créditos aproveitáveis, folha, compras, vendas, perfil B2B/B2C, localização, margens, obrigações acessórias, custos de conformidade, prazos de recebimento e pagamento, capital de giro e repasse de preços. Não escolha regime apenas pela alíquota nominal.\n6. Ao criar fórmulas de Excel ou código, informe nomes de campos, unidades, tratamento de células vazias, exceções e forma de conferir. Não use resultados estimados como se fossem apuração oficial.\n7. Em cálculos tributários, separe crédito contábil, crédito fiscal juridicamente permitido, crédito documentalmente comprovado e crédito efetivamente utilizável; avalie limites, vedações, momento de apropriação e regras de transição.\n8. Não prometa economia, crédito, restituição, homologação ou aceitação por autoridade sem base suficiente.\n\nREFORMA TRIBUTÁRIA\nAo analisar IBS/CBS e Imposto Seletivo:\n- identifique a etapa de transição e o período exato;\n- distinga Constituição, lei complementar, regulamento, ato operacional, leiaute técnico e orientação;\n- verifique se a regra já produz efeitos para o fato analisado;\n- explique impactos sobre preço, margem, crédito, fornecedores, clientes, contratos, faturamento, ERP, documento fiscal, recebimento, pagamento e capital de giro;\n- considere as características reais da empresa e simule cenários com premissas explícitas;\n- não trate alíquota estimada, crédito presumido, regime diferenciado ou split payment como universal;\n- não afirme que o split payment incide de forma idêntica em toda transação ou que crédito é sempre automático;\n- quando faltarem dados ou regulamentação aplicável, entregue uma conclusão condicionada e liste o que falta confirmar.\n\nREVISÃO DE ARQUIVOS, DOCUMENTOS E DADOS\nQuando o usuário fornecer planilha, balancete, razão, demonstração, contrato, nota fiscal, declaração, relatório, imagem ou texto:\n1. Baseie a análise no conteúdo efetivamente visível/disponível.\n2. Não afirme ter visto páginas, abas, fórmulas, anexos ou dados que não foram disponibilizados.\n3. Diferencie erro confirmado, inconsistência provável, alerta para investigação e melhoria recomendada.\n4. Preserve a nomenclatura e a estrutura do material, salvo se o usuário pedir reformulação.\n5. Aponte origem, evidência, impacto potencial, ajuste sugerido e forma de validar.\n6. Proteja dados pessoais e confidenciais; recomende mascaramento quando não forem necessários.\n7. Não altere arquivos, sistemas ou registros externos nem declare que transmitiu obrigações sem autorização e evidência.\n\nRADAR DE RISCOS\nEm análises tributárias, trabalhistas, societárias e de enquadramento, aponte ao menos um ponto de atenção concreto e aplicável ao caso, com a consequência provável, quando existir. Exemplos de pontos que costumam passar despercebidos:\n- Simples Nacional: Fator R calculado com folha incompleta; ultrapassagem de limite ou sublimite; sócio com participação em outras empresas (soma de receitas e vedações); CNAE ou atividade vedada; Anexo IV com CPP recolhida fora do DAS; receita reconhecida em período errado; mudanças para 2027 (opção pelo regime regular de IBS/CBS, NFS-e nacional, sublimite do IBS).\n- Lucro Presumido/Real: acréscimo de presunção da LC 224/2025 acima de R$ 5 milhões/ano; adicional de IRPJ esquecido em simulações; distribuição de lucros acima da presunção sem escrituração que a sustente; PIS/Cofins no regime correto para cada receita.\n- Sócios e pró-labore: INSS de contribuinte individual, IRRF com o redutor da Lei 15.270/2025, retenção de 10% sobre lucros e dividendos acima de R$ 50 mil/mês por fonte pagadora e pessoa física, risco de pró-labore incompatível com a atividade.\n- Folha e eSocial: eventos enviados fora do prazo, inconsistência entre eSocial, EFD-Reinf e DCTFWeb, verbas com incidência diferente de INSS/IRRF/FGTS, convenção coletiva ignorada.\n- Documentos fiscais e reforma: destaque de CBS/IBS nos documentos fiscais em 2026, cClassTrib/CST incorretos, NCM/NBS sem validação técnica, cadastro de clientes e fornecedores desatualizado.\n- Rotina contábil: conciliações pendentes, competência versus caixa, provisões sem suporte, ECD/ECF/EFD divergentes entre si.\nFormato sugerido para o alerta: \"Ponto de atenção: [risco] — [consequência/como mitigar]\". Não invente penalidades, valores de multa ou prazos; se não tiver certeza, diga o que conferir.\n\nMODOS DE TRABALHO DO ESCRITÓRIO\n- Comparativo de regimes / planejamento: peça ou assuma, declarando, os dados mínimos (atividade/CNAE, RBT12 e faturamento mensal, folha e pró-labore, UF/município, perfil B2B ou B2C, margem, despesas dedutíveis e créditos possíveis, regime atual). Calcule o Fator R quando for serviço; compare Simples, Presumido e Real em tabela; apresente SEMPRE a economia líquida (descontando INSS e IRRF dos sócios, CPP, ISS municipal, retenções e custo de conformidade), nunca só a diferença bruta de DAS. Considere o efeito da reforma (2027 em diante, Simples puro versus híbrido) e da Lei 15.270/2025 na retirada dos sócios. Não prometa economia.\n- Resposta ao cliente (WhatsApp/e-mail): texto curto (WhatsApp até 6 linhas), linguagem simples, sem jargão, com a ação recomendada e uma ressalva de validação; entregue o texto pronto, sem explicações sobre ele, salvo se o contador pedir a versão técnica.\n- Proposta de honorários / diagnóstico: estruture escopo, premissas, entregáveis, prazos e condições; deixe os valores como campos a preencher (não invente tabela de preços de mercado).\n- Revisão de cálculo, lançamento ou documento: separe erros confirmados, inconsistências prováveis, pontos a investigar e melhorias; refaça o cálculo mostrando a conta e entregue a versão corrigida.\n- Parecer técnico, resposta a notificação ou minuta de documento: use estrutura formal (fatos, fundamentos, conclusão), marque campos a preencher e lembre que a revisão e a assinatura são do responsável técnico.\n- Planilhas e automação: entregue fórmulas de Excel (informe o idioma/versão assumidos) ou código (Python/SQL) com premissas, entradas, saídas, validações e forma de conferência.\n\nFORMATAÇÃO DA RESPOSTA (o aplicativo renderiza Markdown simples)\n- Use títulos com ## e ###, **negrito**, listas com \"-\" ou \"1.\", tabelas com \"|\" e blocos de código com três crases. Não use HTML nem LaTeX (nada de $...$ ou \\frac): escreva fórmulas em texto, por exemplo: Fator R = Folha dos 12 meses ÷ RBT12.\n- Valores em formato brasileiro (R$ 1.234,56) e percentuais com vírgula. Mostre contas intermediárias em tabela quando houver mais de duas etapas.\n- Conclusão no topo, detalhes depois. Não repita a pergunta, não encha de ressalvas genéricas e evite emojis decorativos. Se a resposta completa ficar muito longa, entregue a parte mais importante e ofereça continuar.\n\nFORMATO DE RESPOSTA ADAPTÁVEL\n- Pergunta simples: responda diretamente, com explicação curta e ressalva essencial.\n- Iniciante: comece pelo conceito simples, depois aprofunde gradualmente e defina termos técnicos.\n- Questão profissional complexa: 1) conclusão executiva; 2) data-base e escopo; 3) fatos e premissas; 4) fundamento técnico/normativo; 5) aplicação passo a passo; 6) cálculos ou lançamentos; 7) obrigações e documentos; 8) riscos, exceções e pontos a confirmar; 9) fontes e próximos passos.\n- Procedimento operacional: pré-requisitos, passos numerados, conferências, erros comuns e resultado esperado.\n- Comparação: tabela de critérios, vantagens, limitações, riscos e condições em que cada alternativa faz sentido.\n- Revisão: separar acertos, erros confirmados, pontos inconclusivos, riscos e versão corrigida.\n- Aula/curso: objetivos, pré-requisitos, explicação progressiva, exemplo resolvido, exercício prático, gabarito comentado, resumo e revisão.\n- Caso empresarial: organizar fatos, diagnóstico, cenários, cálculo, riscos, recomendação condicionada e plano de implementação.\n- Modelos de documentos: fornecer minuta editável, indicar campos a preencher e alertar sobre validações necessárias.\n- Quando a resposta ficar extensa, use títulos, tabelas e listas; priorize clareza, sem repetir a mesma ideia.\n\nLINGUAGEM E ENSINO\nResponda em português brasileiro, salvo pedido diferente. Seja profissional, respeitoso, didático e objetivo. Explique siglas na primeira ocorrência. Use exemplos numéricos simples quando ajudarem. Ao ensinar um assunto complexo, avance do básico ao avançado, mostre por que cada etapa existe e destaque erros recorrentes. Evite excesso de termos técnicos sem explicação, frases vagas e falsa certeza. Adapte o tom ao público: cliente, contador, estudante, gestor, fiscal, auditor ou empresário.\n\nÉTICA, SEGURANÇA E LIMITES\nNão auxilie a sonegar, fraudar, ocultar receitas, fabricar documentos, criar despesas fictícias, falsificar escrituração, manipular demonstrações, burlar controles ou enganar fiscalização, auditoria, credores, empregados ou sócios. Redirecione para correção, regularização e conformidade lícita. Não solicite senhas, chaves privadas ou dados pessoais desnecessários. Não exponha dados confidenciais. Em suspeita de fraude, crime, conflito societário grave, autuação relevante, decadência/prescrição, recuperação judicial, litígio, operação complexa ou impacto material, explique riscos e recomende revisão por profissional habilitado e/ou especialista pertinente.\n\nLIMITES DE RESPONSABILIDADE\nA resposta é apoio técnico e informativo, não garantia de resultado perante Receita Federal, fiscos, tribunais, auditoria, banco, investidor ou terceiro. A aplicação final depende dos fatos, documentos, legislação vigente, normas profissionais e julgamento do responsável técnico. Seja transparente sobre incertezas e não use ressalvas genéricas para evitar uma análise útil: entregue o máximo possível com os dados disponíveis e delimite objetivamente o que precisa ser confirmado.\n\nCONTROLE DE QUALIDADE ANTES DE RESPONDER\nVerifique mentalmente:\n- Respondi exatamente à pergunta?\n- Identifiquei período, jurisdição, regime e tipo de entidade?\n- Separei fatos, premissas e hipóteses?\n- A norma ou princípio citado é pertinente e vigente?\n- Os cálculos fecham e podem ser reproduzidos?\n- O lançamento é coerente com a natureza do fato?\n- Diferenciei contábil, fiscal, financeiro, trabalhista e jurídico quando necessário?\n- Considerei exceções, materialidade, documentação e riscos?\n- Evitei inventar fonte, artigo, prazo, alíquota, código ou consulta?\n- Indiquei próximos passos concretos e pontos de validação?\nCorrija qualquer falha antes de entregar a resposta.\n\nCARDS DE SUGESTÃO\nOs seis cards iniciais são apenas estilos de solicitação: explicação estruturada, iniciante com profundidade, aplicação prática, estratégia, análise direta e ação imediata. Eles não substituem estas instruções e não autorizam omitir fundamento, inventar dados ou abandonar a prudência técnica. Se o usuário mencionar cronograma, arquivos ou contexto anterior, use somente o conteúdo realmente disponível; se não estiver disponível, informe isso sem inventar.\n\n`;\n\n        // ===== ESTADO =====\n        const state = {\n            apiKey: \"\",\n            modelName: CONFIG.MODEL_NAME,\n            messages: [],\n            isGenerating: false,\n            abortController: null,\n            lastPrompt: \"\",\n            userAborted: false,\n            chatGen: 0,\n            currentChatId: null,\n            pendingFiles: [],\n        };\n\n        // ===== DOM ELEMENTS =====\n        const dom = {\n            apiKeyModal: document.getElementById(\"apiKeyModal\"),\n            apiKeyInput: document.getElementById(\"apiKeyInput\"),\n            modelSelect: document.getElementById(\"modelSelect\"),\n            customModelInput: document.getElementById(\"customModelInput\"),\n            saveApiKey: document.getElementById(\"saveApiKey\"),\n            cancelApiKey: document.getElementById(\"cancelApiKey\"),\n            saveSuccess: document.getElementById(\"saveSuccess\"),\n            resetKeyBtn: document.getElementById(\"resetKeyBtn\"),\n            userInput: document.getElementById(\"userInput\"),\n            sidebar: document.getElementById(\"sidebar\"),\n            historyList: document.getElementById(\"historyList\"),\n            attachBtn: document.getElementById(\"attachBtn\"),\n            fileInput: document.getElementById(\"fileInput\"),\n            attachChips: document.getElementById(\"attachChips\"),\n            menuBtn: document.getElementById(\"menuBtn\"),\n            clearHistoryBtn: document.getElementById(\"clearHistoryBtn\"),\n            sendBtn: document.getElementById(\"sendBtn\"),\n            stopBtn: document.getElementById(\"stopBtn\"),\n            charCount: document.getElementById(\"charCount\"),\n            messagesArea: document.getElementById(\"messagesArea\"),\n            chatContainer: document.getElementById(\"chatContainer\"),\n            welcomeScreen: document.getElementById(\"welcomeScreen\"),\n            statusDot: document.getElementById(\"statusDot\"),\n            statusText: document.getElementById(\"statusText\"),\n            newChatBtn: document.getElementById(\"newChatBtn\"),\n            sidebarNewChat: document.getElementById(\"sidebarNewChat\"),\n            exportPdfBtn: document.getElementById(\"exportPdfBtn\"),\n            exportHtmlBtn: document.getElementById(\"exportHtmlBtn\"),\n            exportButtons: document.getElementById(\"exportButtons\"),\n            subjectInput: document.getElementById(\"subjectInput\"),\n            suggestionsContainer: document.getElementById(\"suggestionsContainer\"),\n            printDate: document.getElementById(\"printDate\"),\n            exportPdfAction: document.getElementById(\"exportPdfAction\"),\n            exportHtmlAction: document.getElementById(\"exportHtmlAction\"),\n            exportMarkdownAction: document.getElementById(\"exportMarkdownAction\"),\n        };\n\n        // ===== FUNÇÕES AUXILIARES =====\n        function escapeHtml(text) {\n            const div = document.createElement(\"div\");\n            div.textContent = text;\n            return div.innerHTML;\n        }\n\n        function formatTime(date) {\n            return date.toLocaleTimeString(\"pt-BR\", { hour: \"2-digit\", minute: \"2-digit\" });\n        }\n\n        function scrollToBottom() {\n            if (dom.chatContainer) {\n                dom.chatContainer.scrollTo({\n                    top: dom.chatContainer.scrollHeight,\n                    behavior: \"smooth\"\n                });\n            }\n        }\n\n        function showToast(message) {\n            const existing = document.querySelector(\".toast\");\n            if (existing) existing.remove();\n            const toast = document.createElement(\"div\");\n            toast.className = \"toast\";\n            toast.textContent = message;\n            document.body.appendChild(toast);\n            setTimeout(() => toast.remove(), 3000);\n        }\n\n        function updateStatus(status) {\n            if (!dom.statusDot || !dom.statusText) return;\n            dom.statusDot.classList.remove(\"offline\", \"thinking\");\n            if (status === \"online\") {\n                dom.statusDot.style.background = \"var(--success)\";\n                dom.statusText.textContent = \"Online\";\n            } else if (status === \"thinking\") {\n                dom.statusDot.classList.add(\"thinking\");\n                dom.statusText.textContent = \"Pensando...\";\n            } else {\n                dom.statusDot.classList.add(\"offline\");\n                dom.statusText.textContent = \"Offline\";\n            }\n        }\n\n        function handleInput() {\n            if (!dom.userInput || !dom.sendBtn) return;\n            const value = dom.userInput.value;\n            if (dom.charCount) dom.charCount.textContent = value.length;\n            dom.sendBtn.disabled = (!value.trim() && !state.pendingFiles.length) || state.isGenerating;\n            dom.userInput.style.height = \"auto\";\n            dom.userInput.style.height = Math.min(dom.userInput.scrollHeight, 150) + \"px\";\n        }\n\n        // ===== RENDERIZADOR DE MARKDOWN (seguro: escapa HTML; suporta tabelas, listas aninhadas, citações, código) =====\n        function escHtml(t) {\n            return String(t).replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\").replace(/>/g, \"&gt;\").replace(/\"/g, \"&quot;\");\n        }\n\n        function renderInline(raw) {\n            let s = escHtml(String(raw).replace(/[\\u0000\\u0001]/g, \"\"));\n            const stash = [];\n            const keep = (html) => \"\\u0001\" + (stash.push(html) - 1) + \"\\u0001\";\n\n            // código inline (protege o conteúdo das demais regras)\n            s = s.replace(/`([^`\\n]+)`/g, (m, c) => keep(\"<code>\" + c + \"<\/code>\"));\n            // links [texto](https://...)\n            s = s.replace(/\\[([^\\]\\n]+)\\]\\((https?:\\/\\/[^\\s)]+)\\)/g, (m, t, u) =>\n                keep('<a href=\"' + u + '\" target=\"_blank\" rel=\"noopener noreferrer\">' + t + \"<\/a>\"));\n            // URLs soltas\n            s = s.replace(/(^|[\\s(])(https?:\\/\\/[^\\s<)]+[^\\s<).,;:!?])/g, (m, pre, u) =>\n                pre + keep('<a href=\"' + u + '\" target=\"_blank\" rel=\"noopener noreferrer\">' + u + \"<\/a>\"));\n            // ênfase (não confunde multiplicação \"5 * 3 * 2\" nem snake_case)\n            s = s.replace(/\\*\\*\\*([^*\\n]+?)\\*\\*\\*/g, \"<strong><em>$1<\/em><\/strong>\");\n            s = s.replace(/\\*\\*([^*\\n]+?)\\*\\*/g, \"<strong>$1<\/strong>\");\n            s = s.replace(/(^|[^\\w*])\\*([^*\\s](?:[^*\\n]*?[^*\\s])?)\\*(?![\\w*])/g, \"$1<em>$2<\/em>\");\n            s = s.replace(/(^|[^\\w])_([^_\\s](?:[^_\\n]*?[^_\\s])?)_(?![\\w])/g, \"$1<em>$2<\/em>\");\n            s = s.replace(/~~([^~\\n]+?)~~/g, \"<del>$1<\/del>\");\n\n            return s.replace(/\\u0001(\\d+)\\u0001/g, (m, i) => stash[+i]);\n        }\n\n        function renderMarkdown(src) {\n            const lines = String(src == null ? \"\" : src).replace(/\\r\\n?/g, \"\\n\").split(\"\\n\");\n            const FENCE = /^\\s*```\\s*([\\w+#.-]*)\\s*$/;\n            const HEADING = /^\\s{0,3}(#{1,6})\\s+(.*?)\\s*#*\\s*$/;\n            const HR = /^\\s{0,3}([-*_])(\\s*\\1){2,}\\s*$/;\n            const LIST = /^(\\s*)([-*+•]|\\d+[.)])\\s+(.*)$/;\n            const TSEP = /^\\s*\\|?(\\s*:?-{2,}:?\\s*\\|)+(\\s*:?-{2,}:?\\s*)?$/;\n            const splitRow = (l) => l.trim().replace(/^\\|/, \"\").replace(/\\|$/, \"\").split(\"|\").map(c => c.trim());\n            const isTableStart = (k) => k + 1 < lines.length && lines[k].includes(\"|\") && TSEP.test(lines[k + 1]);\n            const isBlockStart = (k) => FENCE.test(lines[k]) || HEADING.test(lines[k]) || HR.test(lines[k]) ||\n                /^\\s*>/.test(lines[k]) || LIST.test(lines[k]) || isTableStart(k);\n\n            const buildList = (items) => {\n                let html = \"\";\n                const stack = [];\n                for (const it of items) {\n                    const tag = it.ordered ? \"ol\" : \"ul\";\n                    while (stack.length && it.indent < stack[stack.length - 1].indent) {\n                        html += \"<\/li><\/\" + stack.pop().tag + \">\";\n                    }\n                    if (stack.length && it.indent === stack[stack.length - 1].indent) {\n                        html += \"<\/li>\";\n                        if (stack[stack.length - 1].tag !== tag) {\n                            html += \"<\/\" + stack.pop().tag + \"><\" + tag + \">\";\n                            stack.push({ indent: it.indent, tag });\n                        }\n                    } else {\n                        html += \"<\" + tag + \">\";\n                        stack.push({ indent: it.indent, tag });\n                    }\n                    html += \"<li>\" + renderInline(it.text);\n                }\n                while (stack.length) html += \"<\/li><\/\" + stack.pop().tag + \">\";\n                return html;\n            };\n\n            const out = [];\n            let i = 0;\n            while (i < lines.length) {\n                const line = lines[i];\n                if (line.trim() === \"\") { i++; continue; }\n\n                // bloco de código\n                let m = line.match(FENCE);\n                if (m) {\n                    const lang = (m[1] || \"text\").toLowerCase();\n                    const buf = [];\n                    i++;\n                    while (i < lines.length && !/^\\s*```\\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }\n                    i++; // fecha (ou fim do texto, se a resposta foi cortada)\n                    out.push('<pre><code class=\"language-' + escHtml(lang) + '\">' + escHtml(buf.join(\"\\n\")) + \"<\/code><\/pre>\");\n                    continue;\n                }\n                // título\n                m = line.match(HEADING);\n                if (m) {\n                    const lvl = Math.min(m[1].length, 4);\n                    out.push(\"<h\" + lvl + \">\" + renderInline(m[2]) + \"<\/h\" + lvl + \">\");\n                    i++;\n                    continue;\n                }\n                // linha horizontal\n                if (HR.test(line)) { out.push(\"<hr>\"); i++; continue; }\n                // citação\n                if (/^\\s*>/.test(line)) {\n                    const buf = [];\n                    while (i < lines.length && /^\\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\\s*>\\s?/, \"\")); i++; }\n                    out.push(\"<blockquote>\" + renderMarkdown(buf.join(\"\\n\")) + \"<\/blockquote>\");\n                    continue;\n                }\n                // tabela\n                if (isTableStart(i)) {\n                    const head = splitRow(lines[i]);\n                    const aligns = splitRow(lines[i + 1]).map(c =>\n                        /^:-+:$/.test(c) ? \"center\" : /^-+:$/.test(c) ? \"right\" : \"\");\n                    i += 2;\n                    const rows = [];\n                    while (i < lines.length && lines[i].trim() !== \"\" && lines[i].includes(\"|\")) { rows.push(splitRow(lines[i])); i++; }\n                    const cell = (tag, txt, k) => \"<\" + tag + (aligns[k] ? ' style=\"text-align:' + aligns[k] + '\"' : \"\") + \">\" + renderInline(txt || \"\") + \"<\/\" + tag + \">\";\n                    let t = '<div style=\"overflow-x:auto\"><table><thead><tr>' + head.map((h, k) => cell(\"th\", h, k)).join(\"\") + \"<\/tr><\/thead><tbody>\";\n                    for (const r of rows) t += \"<tr>\" + head.map((_, k) => cell(\"td\", r[k], k)).join(\"\") + \"<\/tr>\";\n                    out.push(t + \"<\/tbody><\/table><\/div>\");\n                    continue;\n                }\n                // lista\n                if (LIST.test(line)) {\n                    const items = [];\n                    while (i < lines.length) {\n                        const lm = lines[i].match(LIST);\n                        if (lm) {\n                            items.push({ indent: lm[1].replace(/\\t/g, \"    \").length, ordered: /\\d/.test(lm[2]), text: lm[3] });\n                            i++;\n                        } else if (lines[i].trim() !== \"\" && /^\\s{2,}\\S/.test(lines[i]) && items.length && !isBlockStart(i)) {\n                            items[items.length - 1].text += \" \" + lines[i].trim();\n                            i++;\n                        } else if (lines[i].trim() === \"\" && i + 1 < lines.length && LIST.test(lines[i + 1])) {\n                            i++;\n                        } else break;\n                    }\n                    out.push(buildList(items));\n                    continue;\n                }\n                // parágrafo\n                const buf = [];\n                while (i < lines.length && lines[i].trim() !== \"\" && (buf.length === 0 || !isBlockStart(i))) { buf.push(lines[i]); i++; }\n                out.push(\"<p>\" + buf.map(renderInline).join(\"<br>\") + \"<\/p>\");\n            }\n            return out.join(\"\");\n        }\n\n        // Mantido por compatibilidade com chamadas antigas\n        function formatToHtml(text) { return renderMarkdown(text); }\n\n        // ===== ADD MESSAGE (COM FORMATAÇÃO COMPLETA) =====\n        function addMessage(text, sender, metadata = null) {\n            const isAI = sender === \"ai\" || sender === \"ai_error\";\n            const div = document.createElement(\"div\");\n            div.className = `message ${isAI ? \"ai\" : sender} fade-in`;\n\n            const avatar = document.createElement(\"div\");\n            avatar.className = `avatar ${isAI ? \"ai\" : sender}`;\n            avatar.textContent = isAI ? \"🤖\" : \"U\";\n            div.appendChild(avatar);\n\n            const content = document.createElement(\"div\");\n            content.className = \"message-content\";\n\n            const bubble = document.createElement(\"div\");\n            bubble.className = \"bubble\";\n\n            if (sender === \"ai\") {\n                let md = text;\n                const sources = metadata?.sources || [];\n                if (sources.length) md += buildSourcesMarkdown(sources);\n                bubble.innerHTML = renderMarkdown(md);\n                // Aplicar highlight de código\n                setTimeout(() => {\n                    bubble.querySelectorAll(\"pre code\").forEach((block) => {\n                        if (typeof Prism !== \"undefined\") {\n                            try { Prism.highlightElement(block); } catch (e) { /* idioma sem gramática: ignora */ }\n                        }\n                        addCopyButton(block);\n                    });\n                }, 50);\n            } else {\n                bubble.textContent = text;\n            }\n\n            content.appendChild(bubble);\n\n            if (sender === \"user\" && metadata?.attachments?.length) {\n                const att = document.createElement(\"div\");\n                att.style.cssText = \"display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;\";\n                metadata.attachments.forEach(a => {\n                    const chip = document.createElement(\"span\");\n                    chip.style.cssText = \"font-size:12px;padding:3px 10px;border:1px solid var(--border-color);border-radius:var(--radius-full);color:var(--text-secondary);background:var(--bg-secondary);\";\n                    chip.textContent = `📎 ${a.name}`;\n                    att.appendChild(chip);\n                });\n                content.appendChild(att);\n            }\n\n            // Bloco \"Search Suggestions\" do Google (opcional; ver CONFIG.EXIBIR_SUGESTOES_GOOGLE)\n            if (sender === \"ai\" && CONFIG.EXIBIR_SUGESTOES_GOOGLE && metadata?.searchSuggestionsHtml) {\n                const frame = document.createElement(\"iframe\");\n                frame.setAttribute(\"sandbox\", \"allow-popups allow-popups-to-escape-sandbox\");\n                frame.srcdoc = metadata.searchSuggestionsHtml;\n                frame.style.cssText = \"width:100%;height:60px;border:0;margin-top:8px;background:transparent;\";\n                content.appendChild(frame);\n            }\n\n            const meta = document.createElement(\"div\");\n            meta.className = \"message-meta\";\n            const when = metadata?.ts ? new Date(metadata.ts) : new Date();\n            if (metadata && sender === \"ai\") {\n                const web = metadata.webSearchUsed ? \" | 🔎 web\" : \"\";\n                meta.textContent = `${formatTime(when)} | 📊 ${metadata.outputTokens || 0} tokens | ⏱️ ${metadata.responseTime || 0}ms${web}`;\n            } else {\n                meta.textContent = formatTime(when);\n            }\n            content.appendChild(meta);\n\n            div.appendChild(content);\n\n            if (dom.messagesArea) {\n                dom.messagesArea.appendChild(div);\n                scrollToBottom();\n            }\n        }\n\n        function buildSourcesMarkdown(sources) {\n            const seen = new Set();\n            const items = [];\n            for (const s of sources) {\n                if (!s?.uri || seen.has(s.uri)) continue;\n                seen.add(s.uri);\n                const title = String(s.title || s.uri).replace(/[\\[\\]\\n]/g, \" \").trim().slice(0, 90);\n                items.push(`- [${title}](${s.uri})`);\n                if (items.length >= 8) break;\n            }\n            return items.length ? `\\n\\n**🔎 Fontes consultadas na web:**\\n${items.join(\"\\n\")}` : \"\";\n        }\n\n        function addCopyButton(codeBlock) {\n            const pre = codeBlock.parentNode;\n            const header = document.createElement(\"div\");\n            header.className = \"code-header\";\n            header.innerHTML = `\n                <span>Código<\/span>\n                <button class=\"copy-code-btn\" onclick=\"copyCodeContent(this)\">\n                    <i class=\"material-icons-outlined\">content_copy<\/i>\n                    Copiar\n                <\/button>\n            `;\n            header.dataset.code = codeBlock.textContent;\n            pre.parentNode.insertBefore(header, pre);\n            pre.style.borderRadius = \"0 0 8px 8px\";\n        }\n\n        window.copyCodeContent = function(btn) {\n            const code = btn.parentElement?.dataset.code;\n            if (code) {\n                navigator.clipboard.writeText(code).then(() => {\n                    btn.innerHTML = '<i class=\"material-icons-outlined\">check<\/i> Copiado!';\n                    setTimeout(() => {\n                        btn.innerHTML = '<i class=\"material-icons-outlined\">content_copy<\/i> Copiar';\n                    }, 2000);\n                    showToast(\"📋 Código copiado!\");\n                });\n            }\n        };\n\n        // ===== TYPING INDICATOR =====\n        function showTypingIndicator() {\n            const id = \"typing-\" + Date.now();\n            const div = document.createElement(\"div\");\n            div.id = id;\n            div.className = \"message ai fade-in\";\n            div.innerHTML = `\n                <div class=\"avatar ai\">🤖<\/div>\n                <div class=\"message-content\">\n                    <div class=\"typing-indicator\">\n                        <div class=\"dot\"><\/div>\n                        <div class=\"dot\"><\/div>\n                        <div class=\"dot\"><\/div>\n                    <\/div>\n                    <div class=\"message-meta\">Gemini está digitando...<\/div>\n                <\/div>\n            `;\n            if (dom.messagesArea) {\n                dom.messagesArea.appendChild(div);\n                scrollToBottom();\n            }\n            return id;\n        }\n\n        function removeTypingIndicator(id) {\n            const el = document.getElementById(id
